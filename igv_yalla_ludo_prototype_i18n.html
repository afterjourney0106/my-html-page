<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGV · Yalla Ludo Prototype (ZH / EN / AR)</title>
<style>
  :root{
    --ink:#1C2340; --paper:#F4F5F9; --card:#FFFFFF; --line:#E4E7EF;
    --red:#E4462B; --red-dk:#C93518;
    --gold:#DB9414; --blue:#2E6FE4; --green:#279B63;
    --muted:#7A8098; --note:#FFF7DB; --note-bd:#E8C34A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .num{font-family:"Trebuchet MS","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}

  .topbar{background:var(--ink);color:#fff}
  .topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 20px;height:56px}
  .logo{font-weight:800;font-size:21px;letter-spacing:.5px}
  .logo em{color:var(--red);font-style:normal}
  .top-nav{display:flex;gap:18px;font-size:13px;color:#C6CBDD}
  .top-nav span{cursor:pointer}
  .top-nav span:hover{color:#fff}
  .searchbox{margin-inline-start:auto;display:flex;align-items:center;background:#2A3355;border-radius:18px;padding:6px 14px;gap:8px;min-width:220px}
  .searchbox input{background:none;border:none;outline:none;color:#fff;font-size:13px;flex:1}
  .searchbox input::placeholder{color:#8A92B0}
  .top-user{font-size:13px;color:#C6CBDD;white-space:nowrap}
  .lang-sw{display:flex;border:1px solid #3A4468;border-radius:14px;overflow:hidden}
  .lang-sw button{background:none;border:none;color:#8A92B0;font-size:11.5px;padding:4px 10px}
  .lang-sw button.on{background:var(--red);color:#fff;font-weight:700}
  .ludo-strip{height:4px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr}
  .ludo-strip i:nth-child(1){background:var(--red)}
  .ludo-strip i:nth-child(2){background:var(--gold)}
  .ludo-strip i:nth-child(3){background:var(--green)}
  .ludo-strip i:nth-child(4){background:var(--blue)}

  .crumbs{max-width:1120px;margin:0 auto;padding:12px 20px;font-size:12.5px;color:var(--muted)}
  .crumbs a{color:var(--muted);text-decoration:none;cursor:pointer}
  .crumbs a:hover{color:var(--red)}
  .crumbs b{color:var(--ink);font-weight:600}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
  .view{display:none}
  .view.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .cat-hero{border-radius:12px 12px 0 0;color:#fff;padding:22px 26px;position:relative;overflow:hidden;display:flex;gap:18px;align-items:center}
  .cat-hero::after{content:"";position:absolute;inset-inline-end:-30px;top:-60px;width:260px;height:260px;border-radius:50%;
    background-image:radial-gradient(rgba(255,255,255,.16) 3px,transparent 3.5px);background-size:24px 24px;transform:rotate(12deg)}
  .cat-hero.h-blue{background:linear-gradient(115deg,#1E3A78,#2E6FE4)}
  .cat-hero.h-gold{background:linear-gradient(115deg,#7A4E08,#DB9414)}
  .cat-hero.h-green{background:linear-gradient(115deg,#125237,#279B63)}
  .mini-cover{width:64px;height:64px;border-radius:15px;flex:none;background:conic-gradient(var(--red) 0 25%,var(--gold) 0 50%,var(--green) 0 75%,var(--blue) 0 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.3)}
  .mini-cover span{background:#fff;color:var(--ink);width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9.5px;text-align:center;line-height:1.15}
  .cat-hero .t{position:relative;z-index:1}
  .cat-hero .eyebrow{font-size:12px;opacity:.85;letter-spacing:.5px}
  .cat-hero h1{font-size:21px;font-weight:800;margin:2px 0 4px}
  .save-tag{font-size:13px;background:#FFD84D;color:#7A4E08;border-radius:12px;padding:3px 12px;vertical-align:middle;font-weight:800}
  .cat-hero .desc{font-size:12.5px;opacity:.92;max-width:560px}
  .cat-hero .pill-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .cat-hero .pill{font-size:11px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:2px 9px;border-radius:11px}
  .cat-hero .hstats{margin-inline-start:auto;display:flex;gap:22px;text-align:center;position:relative;z-index:1}
  .cat-hero .hstats b{display:block;font-size:18px}
  .cat-hero .hstats span{font-size:11px;opacity:.8}
  .cat-tabs{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;display:flex;align-items:center;padding:0 8px;margin-bottom:16px}
  .cat-tab{padding:12px 18px;font-size:13.5px;color:var(--muted);border:none;background:none;position:relative;font-weight:600}
  .cat-tab.on{color:var(--ink)}
  .cat-tab.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:2px}
  .cat-tab.t-blue.on::after{background:var(--blue)}
  .cat-tab.t-gold.on::after{background:var(--gold)}
  .cat-tab.t-green.on::after{background:var(--green)}
  .cat-tabs .to-brand{margin-inline-start:auto;font-size:12px;color:var(--muted);padding-inline-end:12px;cursor:pointer}
  .cat-tabs .to-brand:hover{color:var(--red)}

  .hero{background:linear-gradient(115deg,#232C52 0%,#1C2340 55%,#2A1B3D 100%);border-radius:14px;color:#fff;padding:30px 34px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:340px;height:340px;border-radius:50%;
    background-image:radial-gradient(rgba(255,255,255,.14) 3px,transparent 3.5px);background-size:26px 26px;transform:rotate(12deg)}
  .hero-in{display:flex;gap:24px;align-items:center;position:relative;z-index:1}
  .game-cover{width:104px;height:104px;border-radius:22px;flex:none;background:conic-gradient(var(--red) 0 25%,var(--gold) 0 50%,var(--green) 0 75%,var(--blue) 0 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .game-cover span{background:#fff;color:var(--ink);width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;text-align:center;line-height:1.15}
  .hero h1{font-size:26px;font-weight:800}
  .hero .sub{color:#B9C0DA;font-size:13px;margin-top:5px}
  .tags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tag{font-size:11.5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:3px 10px;border-radius:12px;color:#DDE2F2}
  .hero-stats{margin-inline-start:auto;display:flex;gap:28px;text-align:center}
  .hero-stats b{display:block;font-size:20px}
  .hero-stats span{font-size:11.5px;color:#9AA2C2}
  .sec-title{margin:28px 0 14px;display:flex;align-items:baseline;gap:10px}
  .sec-title h2{font-size:17px;font-weight:800}
  .sec-title small{color:var(--muted);font-size:12.5px}
  .biz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .biz-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 20px 18px;position:relative;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s}
  .biz-card:hover{box-shadow:0 10px 26px rgba(28,35,64,.12);transform:translateY(-2px)}
  .biz-card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px}
  .biz-card.c-blue::before{background:var(--blue)}
  .biz-card.c-gold::before{background:var(--gold)}
  .biz-card.c-green::before{background:var(--green)}
  .biz-ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
  .c-blue .biz-ico{background:#EAF1FE}
  .c-gold .biz-ico{background:#FCF3E0}
  .c-green .biz-ico{background:#E5F5EC}
  .biz-card h3{font-size:15.5px;font-weight:700}
  .biz-card p{color:var(--muted);font-size:12.5px;margin-top:6px;min-height:38px}
  .biz-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .biz-meta .from{font-size:12px;color:var(--muted)}
  .biz-meta .from b{font-size:16px;color:var(--red)}
  .go{font-size:12.5px;font-weight:600}
  .c-blue .go{color:var(--blue)} .c-gold .go{color:var(--gold)} .c-green .go{color:var(--green)}
  .trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
  .trust div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--muted);display:flex;gap:9px;align-items:center}
  .trust b{color:var(--ink);display:block;font-size:13px}
  .dot4{width:16px;height:16px;flex:none;border-radius:4px;background:conic-gradient(var(--red) 0 25%,var(--gold) 0 50%,var(--green) 0 75%,var(--blue) 0 100%)}

  .list-head{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
  .f-label{font-size:12.5px;color:var(--muted)}
  .chip{border:1px solid var(--line);background:#fff;border-radius:15px;padding:5px 13px;font-size:12.5px;color:var(--ink)}
  .chip.on{border-color:var(--red);color:var(--red);background:#FDEEEA;font-weight:600}
  .sortbar{margin-inline-start:auto;display:flex;gap:6px}
  .listing{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;gap:16px;align-items:center;margin-bottom:10px;transition:box-shadow .15s}
  .listing.clickable{cursor:pointer}
  .listing:hover{box-shadow:0 8px 20px rgba(28,35,64,.1)}
  .listing.best{border-color:#F1C078;background:linear-gradient(#FFFDF7,#FFF)}
  .seller-ava{width:42px;height:42px;border-radius:50%;flex:none;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
  .l-main{flex:1;min-width:0}
  .l-title{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .l-sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
  .badge{font-size:10.5px;border-radius:4px;padding:1px 6px;font-weight:600}
  .b-gold{background:#FCF3E0;color:var(--gold)}
  .b-green{background:#E5F5EC;color:var(--green)}
  .b-blue{background:#EAF1FE;color:var(--blue)}
  .b-gray{background:#EFF1F6;color:var(--muted)}
  .b-best{background:#B8860B;color:#fff}
  .l-price{text-align:end;flex:none;width:160px}
  .l-price b{font-size:19px;color:var(--red)}
  .l-price small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .btn{border:none;border-radius:8px;font-weight:700;font-size:14px}
  .btn-buy{background:var(--red);color:#fff;padding:9px 22px;flex:none}
  .btn-buy:hover{background:var(--red-dk)}
  .btn-line{background:#fff;border:1.5px solid var(--red);color:var(--red);padding:8px 20px;flex:none}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted);font-size:13px}

  .acct-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .acct-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column}
  .acct-card:hover{box-shadow:0 10px 26px rgba(28,35,64,.13);transform:translateY(-2px)}
  .acct-card.sold{opacity:.5;cursor:default}
  .acct-card.sold:hover{box-shadow:none;transform:none}
  .a-img{aspect-ratio:16/9;background:linear-gradient(135deg,#1C2340,#2A3355);color:#8A92B0;display:flex;align-items:center;justify-content:center;font-size:12.5px;position:relative;cursor:zoom-in}
  .a-img .plat-badge{position:absolute;inset-inline-start:0;top:10px;background:linear-gradient(90deg,var(--red),#F07A3A);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:0 11px 11px 0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  [dir=rtl] .a-img .plat-badge{border-radius:11px 0 0 11px}
  .a-img .v-badge{position:absolute;inset-inline-end:8px;top:10px;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 7px}
  .a-img .img-n{position:absolute;inset-inline-end:8px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;font-size:10.5px;border-radius:4px;padding:1px 7px}
  .a-img .zoom{position:absolute;inset-inline-start:8px;bottom:8px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:11.5px;display:flex;align-items:center;gap:4px}
  .a-img .zoom:hover{background:rgba(0,0,0,.78)}
  .a-body{padding:12px 14px 13px;display:flex;flex-direction:column;flex:1}
  .a-title{font-weight:700;font-size:14px;line-height:1.4}
  .a-attrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .a-attr{font-size:11px;background:#F1F3F8;color:#4A5170;border-radius:4px;padding:2px 8px}
  .a-attr b{color:var(--ink)}
  .a-price-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:11px;gap:8px}
  .a-price{font-size:20px;font-weight:800;color:var(--red)}
  .a-price small{font-size:11px;color:var(--muted);font-weight:400}
  .a-seller{border-top:1px dashed var(--line);margin-top:11px;padding-top:10px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
  .a-seller .shop-ava{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
  .a-seller b{color:var(--ink);font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .a-seller .rate{margin-inline-start:auto;text-align:end;white-space:nowrap}
  .a-seller .rate em{font-style:normal;color:var(--gold);font-weight:700}

  .lightbox{position:fixed;inset:0;background:rgba(12,16,30,.9);z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .lightbox.show{display:flex}
  .lb-close{position:absolute;top:16px;inset-inline-end:22px;background:none;border:none;color:#fff;font-size:28px}
  .lb-stage{display:flex;align-items:center;gap:18px}
  .lb-nav{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:20px}
  .lb-nav:hover{background:rgba(255,255,255,.32)}
  .lb-img{width:min(760px,72vw);aspect-ratio:16/9;background:linear-gradient(135deg,#26304F,#3A4570);border-radius:10px;color:#B9C0DA;display:flex;align-items:center;justify-content:center;font-size:15px}
  .lb-count{color:#B9C0DA;font-size:12.5px}
  .lb-thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .lb-thumb{width:78px;height:48px;border-radius:6px;background:#26304F;border:2px solid transparent;color:#8A92B0;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center;line-height:1.2;padding:2px}
  .lb-thumb.on{border-color:#fff;color:#fff}

  .fbar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;position:relative;z-index:20}
  .fbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fbar-row.more-row{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .fbar-row.more-row.open{display:flex}
  .fdrop{position:relative}
  .fdrop-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--ink)}
  .fdrop-btn .car{font-size:9px;color:var(--muted);transition:transform .15s}
  .fdrop.open .fdrop-btn{border-color:var(--red)}
  .fdrop.open .car{transform:rotate(180deg)}
  .fdrop-btn.hasval{border-color:var(--red);color:var(--red);background:#FDEEEA;font-weight:600}
  .fdrop-panel{display:none;position:absolute;top:calc(100% + 6px);inset-inline-start:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(28,35,64,.18);min-width:200px;z-index:40;padding:8px}
  .fdrop.open .fdrop-panel{display:block}
  .fopt{padding:7px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .fopt:hover{background:#F5F6FA}
  .fopt.checked{color:var(--red);font-weight:600}
  .fopt .cb{width:14px;height:14px;border:1.5px solid #C4C9D8;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .fopt.checked .cb{background:var(--red);border-color:var(--red)}
  .fp-actions{display:flex;gap:8px;padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:6px}
  .fp-actions button{flex:1;padding:6px;border-radius:7px;font-size:12px;border:1px solid var(--line);background:#fff}
  .fp-actions .ok{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
  .price-in{width:72px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;outline:none}
  .sel-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .sel-tag{background:#FDEEEA;color:var(--red);font-size:11.5px;border-radius:12px;padding:3px 10px;display:flex;gap:6px;align-items:center}
  .sel-tag i{font-style:normal;cursor:pointer;font-weight:700}
  .clear-all{font-size:11.5px;color:var(--muted);cursor:pointer;text-decoration:underline}

  .need-hero{background:linear-gradient(#FFFBF0,#fff);border:1.5px solid #F1C078;border-radius:12px;padding:16px 20px 18px;margin-bottom:14px}
  .need-hero .nh-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .need-hero .nh-title::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--gold)}
  .need-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .big-step{display:inline-flex;border:2px solid var(--gold);border-radius:10px;overflow:hidden;background:#fff}
  .big-step button{width:46px;height:48px;background:#FCF3E0;border:none;font-size:22px;color:#7A4E08}
  .big-step input{width:96px;text-align:center;border:none;outline:none;font-size:22px;font-weight:800;color:var(--ink)}
  .need-unit{font-size:15px;font-weight:800}
  .pack-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-inline-start:6px}
  .pack{border:1.5px solid var(--line);border-radius:19px;padding:8px 18px;cursor:pointer;background:#fff;position:relative;font-size:14px;font-weight:800}
  .pack:hover{border-color:var(--gold)}
  .pack.on{border-color:var(--gold);background:#FFFBF0;color:#7A4E08}
  .pack .hot{position:absolute;inset-inline-end:-8px;top:-9px;background:var(--gold);color:#fff;font-size:10px;font-weight:600;padding:1px 7px;border-radius:8px;white-space:nowrap}

  .duo{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .panel h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h3::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--red)}
  .panel h3 .h-sub{font-weight:400;font-size:12px;color:var(--muted)}
  .panel + .panel{margin-top:14px}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 22px;font-size:13px}
  .kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:7px 0;gap:10px}
  .kv span{color:var(--muted)}
  .opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .opt{border:1.5px solid var(--line);border-radius:10px;padding:16px 12px 12px;text-align:center;cursor:pointer;background:#fff;position:relative}
  .opt small{color:var(--muted);font-size:11.5px}
  .opt .offer-n{font-size:10.5px;color:var(--blue);margin-top:2px;display:block}
  .opt .d-name{font-size:13px;font-weight:700}

/* ============================================================
   路由 / 通用
============================================================ */
function crumbsFor(v){
  const C=L;
  const map={
    brand:[[C.crumbHome],[C.crumbBrand]],
    topup:[[C.crumbHome],[C.crumbTopupCat],[C.crumbTopup]],
    'topup-order':[[C.crumbHome],[C.crumbTopupCat],[C.crumbTopup,'topup'],[C.crumbConfirm]],
    coins:[[C.crumbHome],[C.crumbCoinsCat],[C.crumbCoins]],
    'coin-order':[[C.crumbHome],[C.crumbCoinsCat],[C.crumbCoins,'coins'],[C.crumbConfirm]],
    accounts:[[C.crumbHome],[C.crumbAcctCat],[C.crumbAccts]],
    'acct-detail':[[C.crumbHome],[C.crumbAcctCat],[C.crumbAccts,'accounts'],[C.crumbAcctDetail]],
    checkout:[[C.crumbHome],[C.crumbBrand,'brand'],[C.crumbCheckout]],
  };
  return map[v]||[];
}
function go(v){
  currentView=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  const c=crumbsFor(v);
  document.getElementById('crumbs').innerHTML=c.map((x,i)=>{
    if(i===c.length-1)return '<b>'+x[0]+'</b>';
    return x[1]?`<a onclick="go('${x[1]}')">${x[0]}</a>`:'<a>'+x[0]+'</a>';
  }).join('　/　');
  window.scrollTo({top:0});
}
function chipOn(el){
  let sib=el.previousElementSibling, group=[el];
  while(sib&&sib.classList.contains('chip')){group.push(sib);sib=sib.previousElementSibling}
  sib=el.nextElementSibling;
  while(sib&&sib.classList.contains('chip')){group.push(sib);sib=sib.nextElementSibling}
  group.forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
}
function payOn(el){[...el.parentElement.children].forEach(x=>x.classList.remove('on'));el.classList.add('on')}
function togAnno(){
  document.body.classList.toggle('anno-on');
  document.getElementById('anno-btn').textContent=document.body.classList.contains('anno-on')?L.annoBtnHide:L.annoBtnShow;
}

  buildStatic();

const SELL_LABEL={sel:'sPlat',skin:'sSkin',val:'sValue'};
function applyAf(){
  const pl=priceLabel(),cl=coinsLabel(),vl=vipLabel();
  document.getElementById('fd-price-v').textContent=pl?':'+pl:'';
  document.querySelector('#fd-price .fdrop-btn').classList.toggle('hasval',!!pl);
  document.getElementById('fd-coins-v').textContent=cl?':'+cl:'';
  document.querySelector('#fd-coins .fdrop-btn').classList.toggle('hasval',!!cl);
  document.getElementById('fd-vip-v').textContent=vl?':'+vl:'';
  document.querySelector('#fd-vip .fdrop-btn').classList.toggle('hasval',!!vl);
  document.getElementById('fd-sell-v').textContent=af.sell.length?':'+L.selCount(af.sell.length):'';
  document.querySelector('#fd-sell .fdrop-btn').classList.toggle('hasval',af.sell.length>0);
  const tags=[];
  if(pl)tags.push([L.tagPrice+pl,()=>setPrice(null,null,null)]);
  if(cl)tags.push([L.tagCoins+cl,()=>setCoins(0)]);
  if(vl)tags.push([vl,()=>setVip(0)]);
  af.sell.forEach(s=>tags.push([L[SELL_LABEL[s]],()=>{
    af.sell=af.sell.filter(x=>x!==s);af.sellDraft=[...af.sell];
    document.querySelectorAll('#fd-sell .fopt').forEach(x=>{if(x.dataset.v===s)x.classList.remove('checked')});applyAf();
  }]));
  if(af.verified)tags.push([L.fVerifiedOnly,()=>togVerified(document.getElementById('ch-verified'))]);
  const wrap=document.getElementById('sel-tags');
  window._tagFns=tags.map(t=>t[1]);
  if(tags.length){
    wrap.style.display='flex';
    wrap.innerHTML=`<span class="f-label">${L.selPrefix}</span>`
      +tags.map((t,i)=>`<span class="sel-tag">${t[0]}<i onclick="window._tagFns[${i}]()">×</i></span>`).join('')
      +`<span class="clear-all" onclick="clearAf()">${L.clearAll}</span>`;
  }else{wrap.style.display='none';wrap.innerHTML=''}
  renderAccts();
}
function clearAf(){
  af.pMin=af.pMax=null;af.pKey=null;af.coinsMin=0;af.vipMin=0;
  af.sell=[];af.sellDraft=[];af.verified=false;
  document.getElementById('ch-verified').classList.remove('on');
  document.querySelectorAll('#fd-sell .fopt').forEach(x=>x.classList.remove('checked'));
  applyAf();
}
function afMatch(l){
  if(af.pMin!==null&&l.price<af.pMin)return false;
  if(af.pMax!==null&&l.price>af.pMax)return false;
  if(af.coinsMin&&parseInt(l.coins)<af.coinsMin)return false;
  if(af.vipMin&&parseInt(l.vip.replace('VIP',''))<af.vipMin)return false;
  if(af.verified&&!l.verified)return false;
  if(af.sell.length){
    const hit=af.sell.some(s=>(s==='skin'&&l.skins>=5)||(s==='sel'&&l.tag==='sel')||(s==='val'&&l.tag==='val'));
    if(!hit)return false;
  }
  return true;
}

        <div class="field"><label>${L.fPwd}</label><input placeholder="${L.fPwdPh}"></div>`;
    okMsg=curDelivery==='room'?L.okCoinRoom:L.okCoinLogin;
  }
  if(type==='acct'){
    amount=curAcct.price;
    kv=`<div><span>${L.kBiz}</span>${L.bizAcctCk}</div>
        <div><span>${L.kSeller}</span>${N(SELLERS[curAcct.s])}</div>
        <div><span>${L.kGoods}</span>${N(ACCT_TITLES[curAcct.id])}</div>
        <div><span>${L.kVstat}</span>${curAcct.verified?L.adVdone:L.adVwait}</div>
        <div><span>${L.kInsure}</span>${L.kInsureV}</div>
        <div><span>${L.kLock}</span>${L.kLockV}</div>`;
    fields=`<div class="field"><label>${L.fMail}</label><input placeholder="you@example.com"></div>
            <div class="field"><label>${L.fContact2}</label><input placeholder="${L.fContactPh}"></div>`;
    okMsg=L.okAcct;
  }
  return {kv,fields,amount,okMsg};
}
function toCheckout(type){
  orderType=type;
  const c=ckContent(type);
  order={amount:c.amount,okMsg:c.okMsg,coupon:false};
  document.getElementById('ck-kv').innerHTML=c.kv;
  document.getElementById('ck-fields').innerHTML=c.fields;
  document.getElementById('ck-amount').textContent=money(c.amount);
  document.getElementById('ck-coupon').textContent=L.couponPick;
  document.getElementById('ck-total').textContent=money(c.amount);
  go('checkout');
}
function rebuildCheckout(){
  const c=ckContent(orderType);
  order.okMsg=c.okMsg;
  document.getElementById('ck-kv').innerHTML=c.kv;
  document.getElementById('ck-fields').innerHTML=c.fields;
  document.getElementById('ck-amount').textContent=money(order.amount);
  if(order.coupon){
    const off=Math.min(5,order.amount*0.05);
    document.getElementById('ck-coupon').textContent=L.couponUsed(money(off));
    document.getElementById('ck-total').textContent=money(order.amount-off);
  }else{
    document.getElementById('ck-coupon').textContent=L.couponPick;
    document.getElementById('ck-total').textContent=money(order.amount);
  }
}
function coupon(){
  order.coupon=true;
  const off=Math.min(5,order.amount*0.05);
  document.getElementById('ck-coupon').textContent=L.couponUsed(money(off));
  document.getElementById('ck-total').textContent=money(order.amount-off);
}
function paySubmit(){
  if(!document.getElementById('ck-agree').checked){alert(L.agreeAlert);return}
  document.getElementById('ok-msg').textContent=order.okMsg;
  document.getElementById('mask').classList.add('show');
}
function closeOk(){document.getElementById('mask').classList.remove('show');go('brand')}

/* init */
setLang('zh');
go('topup');
</script>
</body>
</html>
