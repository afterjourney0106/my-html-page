<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>iGV · My Boosting Requests</title>
<style>
  :root{--ink:#20242e;--soft:#5f6673;--dim:#9198a4;--orange:#f1652a;--orange-d:#d9531c;--orange-soft:#fdeee7;
    --blue:#2f6fe0;--blue-l:#eaf1fc;--green:#12855a;--green-l:#e5f3ec;--red:#d64545;--red-l:#fdecec;
    --line:#e9eaee;--bg:#f4f5f7;--card:#fff;--sans:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",system-ui,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--sans)}
  a{color:inherit;text-decoration:none}
  /* header */
  .top{background:#fff;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;padding:0 28px;gap:20px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px}
  .logo .hex{width:30px;height:30px;background:var(--orange);color:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;transform:rotate(45deg)}
  .logo .hex span{transform:rotate(-45deg)}
  .logo small{display:block;font-size:8.5px;letter-spacing:.12em;color:var(--dim);font-weight:600}
  .top .sp{flex:1}
  .lang{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;color:var(--soft);cursor:pointer}
  .lang b{color:var(--ink)}
  /* layout */
  .wrap{max-width:1240px;margin:20px auto;padding:0 24px;display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
  /* sidebar */
  .side{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;position:sticky;top:20px}
  .navgrp{padding:8px 6px 4px}
  .navgrp .gt{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);padding:6px 10px}
  .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--soft);cursor:pointer;margin:1px 0}
  .navitem:hover{background:var(--bg)}
  .navitem.on{background:var(--orange-soft);color:var(--orange-d);font-weight:700}
  .navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:auto}
  .navgrp.boost{border:1px solid var(--orange-soft);background:#fffaf7;border-radius:11px;margin-top:6px}
  .navgrp.boost .gt{color:var(--orange-d)}
  /* main */
  .main{min-width:0}
  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .pagehead h1{font-size:22px;margin:0}
  .pagehead .badge-new{font-size:10.5px;font-weight:700;background:var(--orange-soft);color:var(--orange-d);border-radius:6px;padding:2px 8px}
  .pagehead .sp{flex:1}
  .createbtn{background:var(--orange);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer}
  .createbtn:hover{background:var(--orange-d)}
  .subnote{color:var(--soft);font-size:12.5px;margin-bottom:16px}
  .subnote b{color:var(--orange-d)}
  /* tabs + filters */
  .tabsbar{background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;border-bottom:none;padding:6px 16px 0;display:flex;gap:4px;overflow-x:auto}
  .rtab{white-space:nowrap;padding:12px 14px;font-size:14px;color:var(--soft);cursor:pointer;border-bottom:2.5px solid transparent}
  .rtab.on{color:var(--orange-d);font-weight:700;border-bottom-color:var(--orange)}
  .rtab .cnt{font-size:11px;background:var(--bg);color:var(--soft);border-radius:10px;padding:1px 7px;margin-left:5px}
  .rtab.on .cnt{background:var(--orange-soft);color:var(--orange-d)}
  .filters{background:#fff;border:1px solid var(--line);border-top:none;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap}
  .filters .fi{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--dim)}
  .filters .fi.sel{max-width:180px;justify-content:space-between;cursor:pointer;color:var(--soft)}
  /* request cards */
  .cards{background:var(--bg);border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:14px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:13px}
  .rcard:last-child{margin-bottom:0}
  .rc-head{display:flex;align-items:flex-start;gap:12px}
  .rc-icon{width:44px;height:44px;border-radius:10px;background:#2a2f3a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .rc-tt{min-width:0;flex:1}
  .rc-svc{font-weight:700;font-size:15.5px}
  .rc-svc .gm{color:var(--soft);font-weight:600}
  .rc-no{font-size:12px;color:var(--dim);margin-top:2px}
  .rc-status{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
  .oc-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin:-2px 0 13px;font-size:12.5px;color:var(--soft)}
  .oc-bar b{color:var(--ink);font-weight:600}.oc-bar .sp{flex:1}
  .oc-log{color:var(--soft);cursor:pointer}.oc-log:hover{color:var(--orange-d)}
  .st{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 11px}
  .st-await{background:var(--blue-l);color:var(--blue)}
  .st-progress{background:var(--orange-soft);color:var(--orange-d)}
  .st-done{background:var(--green-l);color:var(--green)}
  .st-review{background:#fbf3df;color:#b8860b}
  .st-dispute{background:var(--red-l);color:var(--red)}
  .st-cancel{background:#eef0f3;color:var(--soft)}
  .rc-offers{font-size:12px;color:var(--soft)}.rc-offers b{color:var(--ink)}
  /* attribute chips (the variable part) */
  .attrs{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0 0}
  .chip{font-size:12px;background:#f7f8fa;border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--soft)}
  .chip b{color:var(--ink);font-weight:600}
  .chip.more{color:var(--orange-d);border-color:var(--orange-soft);background:var(--orange-soft);cursor:pointer;font-weight:600}
  /* requirements / notes */
  .rc-text{margin-top:11px;font-size:13px;color:var(--soft);background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .rc-text .rl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--dim);margin-bottom:2px}
  .rc-text + .rc-text{margin-top:7px}
  /* footer meta + actions */
  .rc-foot{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .meta{font-size:12px;color:var(--dim)}.meta b{display:block;font-size:14px;color:var(--ink);font-weight:700;margin-top:1px}
  .meta.price b{color:var(--orange-d);font-size:16px}
  .rc-actions{margin-left:auto;display:flex;gap:9px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 15px;font-size:13px;color:var(--ink);cursor:pointer;font-weight:600}
  .btn:hover{border-color:var(--orange);color:var(--orange-d)}
  .btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
  .btn.primary:hover{background:var(--orange-d);color:#fff}
  .btn.ghost{border-color:transparent;color:var(--soft)}
  .empty{text-align:center;color:var(--dim);padding:50px 0;font-size:14px}
  .hide{display:none!important}
  /* ==== buyer My Order (matches existing) ==== */
  .otabs{background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;border-bottom:none;padding:4px 18px 0;display:flex;gap:22px;overflow-x:auto}
  .otab{white-space:nowrap;padding:14px 2px;font-size:14px;color:var(--soft);cursor:pointer;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:6px}
  .otab.on{color:var(--orange-d);font-weight:700;border-bottom-color:var(--orange)}
  .otab .cnt{font-size:11px;background:var(--bg);color:var(--soft);border-radius:10px;padding:1px 8px}
  .otab.on .cnt{background:var(--orange-soft);color:var(--orange-d)}
  .ofilter{background:#fff;border:1px solid var(--line);border-top:none;padding:14px 18px;display:flex;gap:12px;flex-wrap:wrap}
  .ofilter .fi{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--dim)}
  .ofilter .fi.sel{max-width:200px;justify-content:space-between;cursor:pointer;color:var(--soft)}
  .olist{background:var(--bg);border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:14px}
  .ocard{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .ocard:last-child{margin-bottom:0}
  .oc-top2{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:#f7f8fa;border-bottom:1px solid var(--line);padding:11px 16px;font-size:12.5px;color:var(--soft)}
  .oc-top2 b{color:var(--ink);font-weight:600}.oc-top2 .sp{flex:1}
  .copy{cursor:pointer;color:var(--dim)}.copy:hover{color:var(--orange-d)}
  .contact{color:var(--orange-d);font-weight:600;cursor:pointer}
  .oc-body{display:flex;align-items:center;gap:16px;padding:16px}
  .oc-thumb{width:70px;height:70px;border-radius:9px;background:#2a2f3a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
  .oc-info{flex:1;min-width:0}
  .oc-title{font-weight:700;font-size:14.5px}
  .oc-sub{font-size:12.5px;color:var(--soft);margin-top:3px}
  .oc-prog{font-size:12.5px;color:var(--soft);margin-top:4px}.oc-prog b{color:var(--orange-d)}
  .oc-qty{font-size:13px;color:var(--soft);text-align:center;min-width:52px}
  .oc-unit{font-size:13px;color:var(--soft);min-width:66px;text-align:right}
  .oc-pay{text-align:right;min-width:128px}.oc-pay .pl{font-size:11px;color:var(--dim)}.oc-pay .pv{font-size:19px;font-weight:800;color:var(--ink)}
  .oc-foot{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding:14px 16px}
  .oc-stat{font-weight:700;font-size:13.5px}
  .oc-stat.red{color:var(--red)}.oc-stat.orange{color:var(--orange-d)}.oc-stat.green{color:var(--green)}.oc-stat.gray{color:var(--soft)}
  .oc-statnote{font-size:12.5px;color:var(--soft)}
  .oc-act{margin-left:auto;display:flex;gap:9px;align-items:center;position:relative}
  .dots{border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;color:var(--soft);font-weight:700;background:#fff}
  .dotmenu{position:absolute;right:0;bottom:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:132px;padding:6px;display:none;z-index:5}
  .dotmenu.show{display:block}
  .dotmenu div{padding:9px 12px;font-size:13px;border-radius:7px;cursor:pointer}.dotmenu div:hover{background:var(--bg)}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 4px 2px;color:var(--soft);font-size:13px}
  .pager .pg{border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;background:#fff}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static}}
</style>
</head>

      </section>

        <div class="cards" id="reqcards"></div>

    {icon:'😈',game:{en:'Diablo 4',zh:'暗黑破坏神 4'},cat:{en:'Dungeons',zh:'副本'},svc:{en:'Pit Push',zh:'Pit 冲层'},
     no:'BR20260814-0073',status:'review',offers:0,published:'2026-08-14 08:00',started:'2026-08-14 08:30',finished:'2026-08-14 15:10',price:'$22.00',limit:{en:'3 days',zh:'3 天'},
     attrs:[{l:{en:'Realm',zh:'赛季/模式'},v:{en:'Seasonal · Softcore',zh:'赛季 · 软核'}},{l:{en:'Platform',zh:'平台'},v:{en:'PC',zh:'PC'}},{l:{en:'Target',zh:'目标层'},v:{en:'Pit 100',zh:'Pit 100'}},{l:{en:'Runs',zh:'次数'},v:{en:'8',zh:'8'}}],
     req:null,note:{en:'Seller submitted proof — please review and confirm.',zh:'卖家已提交交付凭证 —— 请查看并确认。'}},

    {icon:'⚔️',game:{en:'World of Warcraft',zh:'魔兽世界'},cat:{en:'Leveling',zh:'升级'},svc:{en:'Power Leveling',zh:'Power Leveling'},
     no:'BR20260809-0018',status:'dispute',offers:0,published:'2026-08-09 10:00',started:'2026-08-09 10:30',estFinish:'2026-08-12 10:30',price:'$28.00',limit:{en:'3 days',zh:'3 天'},
     attrs:[{l:{en:'Region',zh:'地区'},v:{en:'US',zh:'美服'}},{l:{en:'Faction',zh:'阵营'},v:{en:'Alliance',zh:'联盟'}},{l:{en:'Class',zh:'职业'},v:{en:'Mage',zh:'法师'}},{l:{en:'Level',zh:'等级'},v:{en:'1 → 80',zh:'1 → 80'}}],
     req:null,note:{en:'Result did not match — refund requested, under review.',zh:'完成情况不符 —— 已申请退款,平台审核中。'}}
  ];

  var curTab='all';
  var CHIP_LIMIT=5;

  function tabMatch(r,id){if(id=='all')return ['progress','review','evaluate','done','dispute'].indexOf(r.status)>=0;var tb=OTABS.filter(function(x){return x.id==id;})[0];if(tb&&tb.match)return tb.match.indexOf(r.status)>=0;return r.status==id;}
  function ocount(id){return REQ.filter(function(r){return tabMatch(r,id);}).length;}

  /* ---- My Order (buyer orders) ---- */
  function renderOTabs(){
    document.getElementById('otabs').innerHTML=OTABS.map(function(tb){
      var c=ocount(tb.id);
      return '<div class="otab'+(tb.id==curTab?' on':'')+'" data-id="'+tb.id+'">'+t(tb.name)+(c>0?'<span class="cnt">'+c+'</span>':'')+'</div>';
    }).join('');
  }
  function subline(r){
    var parts=r.attrs.slice(0,2).map(function(a){return t(a.l)+': '+t(a.v);});
    return t(r.game)+' · '+t(r.svc)+(parts.length?('  ·  '+parts.join(' / ')):'');
  }
  function orderCard(r,i){
    var s=OSTATUS[r.status];
    var prog=(r.status=='done'||r.status=='review'||r.status=='evaluate')?'1 / 1':'0 / 1';
    var contact=(r.status=='progress'||r.status=='review'||r.status=='dispute'||r.status=='evaluate')
      ?'<span class="sp"></span><span class="contact" data-chat="'+i+'">✉ '+(lang=='zh'?'联系卖家':'Contact Seller')+'</span>':'';
    var note='';
    if(r.status=='progress') note='<span class="oc-statnote">'+(lang=='zh'?'催单提醒已发送 —— 等待卖家交付。':'Shipment reminder sent — awaiting seller.')+'</span>';
    else if(r.status=='review') note='<span class="oc-statnote">'+(lang=='zh'?'卖家已交付,请确认收货。':'Seller delivered — please confirm receipt.')+'</span>';
    else if(r.status=='dispute') note='<span class="oc-statnote">'+t(r.note||{en:'',zh:''})+'</span>';
    // actions per status
    var act='';
    if(r.status=='progress') act='<div class="dots" data-menu="'+i+'">⋯</div><div class="dotmenu" id="dm'+i+'"><div data-refund="'+i+'" data-zh="申请退款">Refund</div></div><button class="btn primary" data-zh="订单详情">Order Details</button>';
    else if(r.status=='review') act='<div class="dots" data-menu="'+i+'">⋯</div><div class="dotmenu" id="dm'+i+'"><div data-refund="'+i+'" data-zh="申请退款">Refund</div></div><button class="btn" data-zh="订单详情">Order Details</button><button class="btn primary" data-zh="确认收货">Confirm Receipt</button>';
    else if(r.status=='evaluate') act='<button class="btn" data-zh="订单详情">Order Details</button><button class="btn primary" data-zh="评价">Evaluate</button>';
    else if(r.status=='done') act='<button class="btn" data-zh="订单详情">Order Details</button><button class="btn primary" data-zh="再次购买">Buy Again</button>';
    else if(r.status=='dispute') act='<button class="btn" data-zh="订单详情">Order Details</button><button class="btn primary" data-zh="退款详情">Refund Details</button>';
    else act='<button class="btn" data-zh="订单详情">Order Details</button><button class="btn primary" data-zh="再次购买">Buy Again</button>';
    return '<div class="ocard">'+
      '<div class="oc-top2"><span>'+(lang=='zh'?'订单号:':'Order Number: ')+'<b>'+r.no+'</b> <span class="copy" data-copy="'+r.no+'">⧉</span></span>'+
        '<span>'+(lang=='zh'?'下单时间:':'Order Created Time: ')+'<b>'+r.published+'</b></span>'+contact+'</div>'+
      '<div class="oc-body"><div class="oc-thumb">'+r.icon+'</div>'+
        '<div class="oc-info"><div class="oc-title">'+t(r.svc)+'</div>'+
          '<div class="oc-sub">'+subline(r)+'</div>'+
          '<div class="oc-prog">'+(lang=='zh'?'交付进度:':'Delivery Progress: ')+'<b>'+prog+'</b></div></div>'+
        '<div class="oc-qty">×1</div>'+
        '<div class="oc-unit">'+r.price+'</div>'+
        '<div class="oc-pay"><div class="pl">'+(lang=='zh'?'实付金额':'Payment Amount')+'</div><div class="pv">'+r.price+'</div></div></div>'+
      '<div class="oc-foot"><span class="oc-stat '+s.cls+'">'+t(s.name)+'</span>'+note+
        '<div class="oc-act">'+act+'</div></div></div>';
  }
  function pagerHtml(n){return '<span>'+(lang=='zh'?'共 ':'Total ')+n+'</span><span class="pg">‹</span><span class="pg" style="border-color:var(--orange);color:var(--orange-d)">1</span><span class="pg">›</span><span>'+(lang=='zh'?'前往':'Go to')+'</span>';}
  function renderOrders(){
    var list=REQ.filter(function(r){return tabMatch(r,curTab);});
    document.getElementById('olist').innerHTML=list.length?list.map(function(r){return orderCard(r,REQ.indexOf(r));}).join(''):'<div class="empty">'+(lang=='zh'?'该状态下暂无订单。':'No orders in this status.')+'</div>';
    document.getElementById('orderPager').innerHTML=pagerHtml(list.length);
  }

  /* ---- My Requests (original style; only Awaiting offers / Canceled) ---- */
  var reqTab='all';
  function reqMatch(r,id){if(id=='all')return r.status=='await'||r.status=='cancel';return r.status==id;}
  function reqCount(id){return REQ.filter(function(r){return reqMatch(r,id);}).length;}
  function renderReqTabs(){
    document.getElementById('reqtabs').innerHTML=RTABS.map(function(tb){
      return '<div class="rtab'+(tb.id==reqTab?' on':'')+'" data-id="'+tb.id+'">'+t(tb.name)+'<span class="cnt">'+reqCount(tb.id)+'</span></div>';
    }).join('');
  }
  function chipHtml(a){return '<span class="chip">'+t(a.l)+': <b>'+t(a.v)+'</b></span>';}
  function reqCard(r){
    var s=STATUS[r.status];
    var shown=r.attrs.slice(0,CHIP_LIMIT).map(chipHtml).join('');
    var extra=r.attrs.length>CHIP_LIMIT?'<span class="chip more" data-more="'+r.no+'">+'+(r.attrs.length-CHIP_LIMIT)+' '+(lang=='zh'?'更多':'more')+'</span>':'';
    var reqTxt=r.req?'<div class="rc-text"><div class="rl">'+(lang=='zh'?'需求要求':'Requirements')+'</div>'+t(r.req)+'</div>':'';
    var noteTxt=r.note?'<div class="rc-text"><div class="rl">'+(lang=='zh'?'备注':'Notes')+'</div>'+t(r.note)+'</div>':'';
    var actions=r.status=='await'
      ? '<button class="btn ghost" data-zh="取消需求">Cancel</button>'
      : '<button class="btn" data-zh="重新发布">Post again</button>';
    var M=function(label,val){return '<div class="meta">'+label+'<b>'+val+'</b></div>';};
    var timeMetas=r.status=='await'
      ? M(lang=='zh'?'发布时间':'Published',r.published)+M(lang=='zh'?'报价有效期至':'Offer valid until',r.expires)
      : M(lang=='zh'?'发布时间':'Published',r.published);
    var offersTag=(r.status=='await')?'<span>'+(lang=='zh'?'可用报价 ':'Offers ')+'<b>'+r.offers+'</b></span>':'';
    var dv=r.attrs.filter(function(a){return a.l.en=='Delivery';})[0];
    var subL=dv?(lang=='zh'?'完成方式: ':'Delivery: ')+t(dv.v):(lang=='zh'?'游戏平台: ':'Platform: ')+t((r.attrs.filter(function(a){return a.l.en=='Platform';})[0]||{v:{en:'—',zh:'—'}}).v);
    return '<div class="rcard">'+
      '<div class="oc-bar"><span>'+(lang=='zh'?'需求编号 ':'Request No. ')+'<b>'+r.no+'</b></span>'+
        '<span>'+(lang=='zh'?'发布 ':'Posted ')+'<b>'+r.published+'</b></span>'+
        '<span class="sp"></span>'+offersTag+'<span class="st '+s.cls+'">'+t(s.name)+'</span></div>'+
      '<div class="rc-head"><div class="rc-icon">'+r.icon+'</div>'+
        '<div class="rc-tt"><div class="rc-svc"><span class="gm">'+t(r.game)+' · '+t(r.cat)+' · </span>'+t(r.svc)+'</div>'+
          '<div class="rc-no">'+subL+'</div></div></div>'+
      '<div class="attrs">'+shown+extra+'</div>'+reqTxt+noteTxt+
      '<div class="rc-foot">'+timeMetas+
        '<div class="meta price">'+(lang=='zh'?'你的预算':'Your budget')+'<b>'+r.price+'</b></div>'+
        '<div class="meta">'+(lang=='zh'?'代练限时':'Time limit')+'<b>'+t(r.limit)+'</b></div>'+
        '<div class="rc-actions">'+actions+'</div>'+
      '</div></div>';
  }
  function renderReqs(){
    var list=REQ.filter(function(r){return reqMatch(r,reqTab);});
    document.getElementById('reqcards').innerHTML=list.length?list.map(reqCard).join(''):'<div class="empty">'+(lang=='zh'?'该状态下暂无需求。':'No requests in this status.')+'</div>';
  }

  /* ---- page switch ---- */
  function switchPage(p){
    document.getElementById('page-order').classList.toggle('hide',p!='order');
    document.getElementById('page-req').classList.toggle('hide',p!='req');
    document.querySelectorAll('.navitem[data-page]').forEach(function(n){n.classList.toggle('on',n.dataset.page==p);});
  }
  document.querySelectorAll('.navitem[data-page]').forEach(function(n){n.addEventListener('click',function(){switchPage(n.dataset.page);});});

  document.getElementById('otabs').addEventListener('click',function(e){var t=e.target.closest('.otab');if(t){curTab=t.dataset.id;renderOTabs();renderOrders();applyStaticLang();}});
  document.getElementById('olist').addEventListener('click',function(e){
    var mm=e.target.closest('[data-menu]');if(mm){var m=document.getElementById('dm'+mm.dataset.menu);document.querySelectorAll('.dotmenu').forEach(function(x){if(x!=m)x.classList.remove('show');});m.classList.toggle('show');return;}
    var rf=e.target.closest('[data-refund]');if(rf){toast(lang=='zh'?'已提交退款申请(原型略)':'Refund requested (stub)');document.querySelectorAll('.dotmenu').forEach(function(x){x.classList.remove('show');});return;}
    var c=e.target.closest('[data-chat]');if(c){toast(lang=='zh'?'打开与卖家的聊天(原型略)':'Open chat with seller (stub)');return;}
    var cp=e.target.closest('[data-copy]');if(cp){toast(lang=='zh'?'已复制订单号':'Order number copied');return;}
    document.querySelectorAll('.dotmenu').forEach(function(x){x.classList.remove('show');});
  });
  document.getElementById('reqtabs').addEventListener('click',function(e){var t=e.target.closest('.rtab');if(t){reqTab=t.dataset.id;renderReqTabs();renderReqs();applyStaticLang();}});
  document.getElementById('reqcards').addEventListener('click',function(e){
    var m=e.target.closest('.chip.more');
    if(m){var r=REQ.filter(function(x){return x.no==m.dataset.more;})[0];if(r)m.parentElement.innerHTML=r.attrs.map(chipHtml).join('');}
  });

  function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.opacity=1;setTimeout(function(){el.style.opacity=0;},2000);}

  function renderAll(){renderOTabs();renderOrders();renderReqTabs();renderReqs();applyStaticLang();}

  /* language toggle (static labels via data-zh; dynamic via re-render) */
  function applyStaticLang(){
    document.querySelectorAll('[data-zh]').forEach(function(el){
      if(!el.hasAttribute('data-en'))el.setAttribute('data-en',el.textContent);
      el.textContent=lang=='zh'?el.getAttribute('data-zh'):el.getAttribute('data-en');
    });
    document.querySelector('#langBtn b').textContent=lang=='zh'?'中文':'English';
  }
  document.getElementById('langBtn').addEventListener('click',function(){lang=lang=='zh'?'en':'zh';renderAll();});

  renderAll();
</script>
</body>
</html>
