<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Forever Boosting Demo</title>
<style>
:root{
  --brand-500:#FF6633;--brand-600:#FF4B0F;--brand-700:#EB3B00;--brand-50:#FFECE6;
  --text-primary:#1F2937;--text-secondary:#6B7280;--text-muted:#9CA3AF;
  --bg-page:#F5F6F8;--bg-card:#FFF;--bg-soft:#F7F8FA;--bg-hover:#FAFAFA;
  --divider:#ECEEF1;--divider-2:#E1E4E8;
  --success:#16A34A;--success-bg:#F0FDF4;--danger:#DC2626;--danger-bg:#FEF2F2;
  --warning:#D97706;--warning-bg:#FFFBEB;--info:#2563EB;--info-bg:#EFF6FF;
  --r-sm:5px;--r-md:8px;--r-lg:12px;--r-pill:9999px;--sh:0 1px 3px rgba(16,24,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.3}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--text-primary)}
.hidden{display:none!important}
.dnav{position:sticky;top:0;z-index:99;background:#14171B;border-bottom:1px solid #262C33;color:#A9B2BB;font-size:12.5px}
.dnav-in{max-width:1320px;margin:0 auto;padding:6px 18px;min-height:40px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dnav b{color:#fff;font-size:12.5px}
.dnav label{display:flex;align-items:center;gap:5px;cursor:pointer}
.dseg{display:inline-flex;border:1px solid #2E353D;border-radius:5px;overflow:hidden}
.dseg button{background:none;border:0;color:#A9B2BB;padding:4px 11px;font-size:12.5px}
.dseg button.on{background:var(--brand-500);color:#fff;font-weight:600}
.top{background:#fff;border-bottom:1px solid var(--divider)}
.top-in{max-width:1320px;margin:0 auto;padding:0 18px;height:58px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em}.logo span{color:var(--brand-500)}
.search{flex:1;max-width:330px;background:var(--bg-soft);border:1px solid var(--divider);border-radius:var(--r-pill);padding:8px 15px;color:var(--text-muted);font-size:13px}
.top .sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--divider-2);border-radius:var(--r-pill);overflow:hidden}
.lang button{background:#fff;border:0;padding:6px 13px;font-size:12.5px;color:var(--text-secondary)}
.lang button.on{background:var(--brand-50);color:var(--brand-600);font-weight:700}
.wrap{max-width:1320px;margin:0 auto;padding:16px 18px 70px}
.crumb{font-size:13px;color:var(--text-secondary);margin-bottom:14px}
.crumb b{color:var(--text-primary)}
.ghead{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.gicon{width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,#3a5da8,#1c2f5e);display:grid;place-items:center;font-size:29px;flex:none}
.ghead h1{font-size:23px;margin-bottom:5px}
.badges{display:flex;gap:14px;flex-wrap:wrap;color:var(--text-secondary);font-size:12.5px}
.badges .g{color:var(--success);font-weight:600}
.note-d{background:var(--warning-bg);border:1px dashed #f3d58a;color:#92400E;border-radius:var(--r-md);padding:9px 13px;font-size:12.5px;margin:10px 0;line-height:1.7}
body:not(.notes) .note-d{display:none}
.src{font-size:11.5px;color:var(--text-muted);margin-left:6px;font-weight:400}
body:not(.notes) .src{display:none}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 12px}
.tab{background:#fff;border:1px solid var(--divider-2);border-radius:var(--r-md);padding:10px 18px;font-weight:600;font-size:14.5px}
.tab.on{border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 14px;border:1px solid var(--divider-2);border-radius:var(--r-pill);font-size:13px;background:#fff;user-select:none}
.chip:hover{border-color:#c9ced6}
.chip.on{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-600);font-weight:600}
.svcrow{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.svcrow .l{color:var(--text-secondary);font-size:13px}
.main{display:grid;grid-template-columns:1fr 352px;gap:16px;align-items:start}
.card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px 20px}
.card h2{font-size:16.5px;margin-bottom:4px}
.desc{color:var(--text-secondary);font-size:12.5px;margin-bottom:16px;line-height:1.6}
.fld{margin-bottom:17px}
.fld>label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.rq{color:var(--danger);margin-left:2px}
.opt{color:var(--text-muted);font-weight:400;font-size:12px;margin-left:5px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--divider-2);border-radius:var(--r-md);padding:9px 12px;font-size:14px;background:#fff}
select.inp{height:40px;padding:0 11px}
textarea.inp{min-height:70px;resize:vertical}
.inp:focus{outline:none;border-color:var(--brand-500)}
.rgbox{border:1px solid var(--divider);border-radius:var(--r-md);padding:13px 15px;background:var(--bg-soft)}
.rghead{display:flex;justify-content:space-between;gap:10px}
.rghead .l{font-size:12px;color:var(--text-secondary)}
.rghead input{width:92px;border:1px solid var(--divider-2);border-radius:var(--r-sm);padding:6px 9px;text-align:center;font-weight:700;font-size:16px}
.u{color:var(--text-muted);font-size:12px;margin-left:5px}
.rng{position:relative;height:30px;margin-top:8px}
.rng .track{position:absolute;left:0;right:0;top:13px;height:5px;background:#e3e6eb;border-radius:3px}
.rng .fill{position:absolute;top:13px;height:5px;background:var(--brand-500);border-radius:3px}
.rng input{position:absolute;left:0;width:100%;top:5px;-webkit-appearance:none;appearance:none;background:none;pointer-events:none;margin:0}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--brand-500);cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand-500)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)}
.pfpair{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pfpair>div{flex:1;min-width:190px}
.stp2{display:inline-flex;border:1px solid var(--divider-2);border-radius:var(--r-md);overflow:hidden;background:#fff}
.stp2 button{background:#fff;border:0;width:34px;height:38px;font-size:16px}
.stp2 span{min-width:46px;display:grid;place-items:center;font-weight:700;border-left:1px solid var(--divider-2);border-right:1px solid var(--divider-2)}
.dnote{font-size:12px;color:var(--text-secondary);margin-top:7px}
.warnchip{font-size:11px;color:var(--danger);background:var(--danger-bg);border-radius:4px;padding:1px 6px;margin-left:5px}
.deposit{font-size:12px;color:var(--success);background:var(--success-bg);border-radius:var(--r-md);padding:9px 11px;margin:12px 0;line-height:1.6}
.side .card{margin-bottom:12px}
.side h3{font-size:15px;margin-bottom:11px}
.cta{width:100%;height:46px;border:0;border-radius:var(--r-md);background:var(--brand-500);color:#fff;font-size:15px;font-weight:700}
.cta:hover{background:var(--brand-600)}
.mini{display:flex;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--divider)}
.mini:last-child{border:0}
.mini .k{color:var(--text-secondary);width:88px;flex:none}
.postreq{display:block;text-align:center;margin-top:11px;color:var(--brand-600);font-size:13px;cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(15,18,25,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:200;overflow:auto}
.mask.on{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);width:100%;max-width:840px;padding:20px}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.qsum{color:var(--text-secondary);font-size:12.5px;margin:5px 0 12px}
.sorts{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.sl{position:relative;border:1px solid var(--divider-2);border-radius:var(--r-md);padding:13px 15px;margin-bottom:11px}
.sl.best{border-color:var(--brand-500)}
.sl.late{opacity:.5}
.rib{position:absolute;top:-9px;left:13px;background:var(--brand-500);color:#fff;font-size:11px;padding:1px 9px;border-radius:var(--r-pill)}
.sl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.sl-id .nm{font-weight:700}
.cert{font-size:11px;color:var(--success);background:var(--success-bg);border-radius:var(--r-sm);padding:1px 7px;margin-left:6px;font-weight:600}
.st{font-size:12px;color:var(--text-secondary)}
.st .on{color:var(--success)}
.sl-eta .l{font-size:11px;color:var(--text-muted)}.sl-eta .v{font-weight:600;font-size:13px}
.sl-sp{flex:1}
.sl-p{font-size:20px;font-weight:800;color:var(--brand-600)}
.sl-bd{font-size:12px;color:var(--text-secondary);margin-top:9px;background:var(--bg-soft);border-radius:var(--r-sm);padding:6px 9px}
.gd{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.gd span{font-size:11.5px;border-radius:var(--r-sm);padding:1px 8px;background:var(--success-bg);color:var(--success)}
.gd span.n{background:var(--bg-soft);color:var(--text-muted);text-decoration:line-through}
.qfoot{display:flex;gap:12px;align-items:center;border-top:1px solid var(--divider);padding-top:13px;flex-wrap:wrap}
.btn{height:40px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--divider-2);background:#fff;font-size:14px;font-weight:500}
.btn:hover{background:var(--bg-hover)}
.btn.pri{background:var(--brand-500);border-color:var(--brand-500);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--brand-600)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.modes{display:flex;gap:9px;margin-bottom:13px}
.item{border:1px solid var(--divider);border-radius:var(--r-md);padding:14px 16px;margin-bottom:11px;background:var(--bg-soft)}
.item .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.ref{font-size:12px;color:var(--info);background:var(--info-bg);border-radius:var(--r-sm);padding:3px 9px;display:inline-block}
.bid{display:flex;align-items:center;gap:8px}
.bid input{width:140px;border:1px solid var(--divider-2);border-radius:var(--r-md);padding:9px 11px;font-size:16px;font-weight:700}
.shell{display:flex;align-items:flex-start}
.sside{width:200px;flex:none;background:#fff;border-right:1px solid var(--divider);min-height:520px;padding:12px 0;border-radius:var(--r-lg) 0 0 var(--r-lg)}
.sside a{display:block;padding:9px 20px;font-size:13.5px;color:var(--text-primary);text-decoration:none}
.sside a.on{background:var(--brand-50);color:var(--brand-600);font-weight:600;box-shadow:inset 3px 0 0 var(--brand-500)}
.sside .gp{padding:12px 20px 6px;font-size:11px;letter-spacing:.08em;color:var(--text-muted);font-weight:600}
.smain{flex:1;min-width:0;padding-left:22px}
.steps{display:flex;background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.stp{flex:1;padding:14px 18px;display:flex;align-items:center;gap:12px;border:0;border-right:1px solid var(--divider);position:relative;min-width:0;background:#fff;text-align:left}
.stp:last-child{border-right:0}
.stp .ic{width:34px;height:34px;border-radius:9px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.stp .n{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-muted)}
.stp .t{display:block;font-size:14.5px;font-weight:600;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.on .ic{background:var(--brand-50)}
.stp.on .n,.stp.on .t{color:var(--brand-600)}
.stp.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.5px;background:var(--brand-500)}
.stp.done .ic{background:var(--success-bg)}
.stp.done .t{color:var(--text-primary)}
.scard{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-b{padding:18px 20px}
.card-b>h2{font-size:16px;margin-bottom:4px}
.card-b>.sub{font-size:12.5px;color:var(--text-secondary);margin-bottom:14px;line-height:1.6}
.hint{background:var(--warning-bg);border-radius:var(--r-md);padding:10px 13px;font-size:12.5px;color:#92400E;line-height:1.6}
.hint b{color:var(--warning);font-weight:700}
.frm{background:var(--info-bg);border-radius:var(--r-md);padding:9px 12px;font-size:12px;color:var(--info);line-height:1.6;margin-bottom:13px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px}
.pick{border:1.5px solid var(--divider-2);border-radius:var(--r-md);padding:13px 15px;display:flex;align-items:center;gap:11px;background:#fff;text-align:left;width:100%}
.pick.on{border-color:var(--brand-500);background:var(--brand-50)}
.pick .rd{width:17px;height:17px;border-radius:50%;border:1.5px solid #c9ced6;flex:none;position:relative;background:#fff}
.pick.on .rd{border-color:var(--brand-500)}
.pick.on .rd::after{content:'';position:absolute;left:3.5px;top:3.5px;width:8px;height:8px;border-radius:50%;background:var(--brand-500)}
.pick .t b{display:block;font-weight:600;font-size:14px}
.pick .t span{font-size:12px;color:var(--text-secondary)}
.pick.dis{opacity:.42;cursor:not-allowed}
.lock{font-size:11.5px;font-weight:600;color:var(--warning);background:var(--warning-bg);padding:2px 9px;border-radius:var(--r-sm)}
.rate{border:1px solid var(--divider);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:14px;background:var(--bg-soft)}
.rate .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.rate .rh h3{font-size:14.5px}
.rate .rh .tg{font-size:11px;font-weight:600;padding:2px 9px;border-radius:var(--r-sm);background:var(--info-bg);color:var(--info)}
.rate .rs{font-size:12.5px;color:var(--text-secondary);margin-bottom:13px;line-height:1.6}
.segs{background:#fff;border:1px solid var(--divider);border-radius:var(--r-md);overflow:hidden}
.seghd,.segrow{display:grid;grid-template-columns:92px 92px 1fr 92px 34px;gap:10px;align-items:center;padding:9px 13px}
.seghd{background:var(--bg-soft);font-size:11.5px;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--divider)}
.segrow{border-bottom:1px solid var(--divider)}
.segrow:last-child{border-bottom:0}
.segrow select,.segrow input{width:100%;height:34px;border:1px solid var(--divider-2);border-radius:var(--r-sm);padding:0 8px;font-size:13.5px;background:#fff}
.segrow select:disabled{background:var(--bg-soft);color:var(--text-secondary);opacity:1}
.segrow .pw{position:relative}
.segrow .pw .cur{position:absolute;left:9px;top:7px;color:var(--text-muted);font-size:13px}
.segrow .pw input{padding-left:22px;text-align:right}
.segrow .sub{font-size:13.5px;font-weight:600;text-align:right}
.segrow .del{color:var(--danger);text-align:center;font-size:15px;background:none;border:0}
.segft{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:11px}
.segft .add{padding:7px 14px;border:1px solid var(--divider-2);border-radius:var(--r-md);background:#fff;font-size:13px}
.segft .meta{margin-left:auto;font-size:12.5px;color:var(--text-secondary)}
.chk{margin-top:11px;padding:9px 13px;border-radius:var(--r-md);font-size:13px;display:flex;align-items:center;gap:8px}
.chk.ok{background:var(--success-bg);color:var(--success)}
.coef{background:#fff;border:1px solid var(--divider);border-radius:var(--r-md);overflow:hidden}
.coef .cr{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid var(--divider)}
.coef .cr:last-child{border-bottom:0}
.coef .cn{flex:1;min-width:0;font-size:13.5px}
.ckb{width:18px;height:18px;border:1.5px solid #c9ced6;border-radius:5px;background:#fff;flex:none;position:relative;padding:0}
.ckb.on{background:var(--brand-500);border-color:var(--brand-500)}
.ckb.on::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.coef .cr.off .cn{color:var(--text-muted)}
.coef .cmode select{height:30px;border:1px solid var(--divider-2);border-radius:var(--r-sm);padding:0 8px;font-size:12.5px;background:#fff}
.coef .cv{width:104px;flex:none}
.coef .cv input{width:100%;height:30px;border:1px solid var(--divider-2);border-radius:var(--r-sm);padding:0 8px;font-size:13.5px;text-align:right}
.pwrap{display:flex;gap:16px;align-items:flex-start}
.pmain{flex:1;min-width:0}
.pside{width:320px;flex:none;position:sticky;top:16px}
.calc{background:#fff;border:1.5px solid var(--brand-500);border-radius:var(--r-lg);overflow:hidden}
.calc .ch{padding:11px 15px;background:var(--brand-50);border-bottom:1px solid #ffd6c4;display:flex;align-items:center;font-size:14px;font-weight:600;color:var(--brand-600)}
.calc .cb{padding:14px 15px}
.calc label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px}
.calc select,.calc input{width:100%;height:34px;border:1px solid var(--divider-2);border-radius:var(--r-md);padding:0 9px;font-size:13.5px}
.calc .two2{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.calc .two2 select{flex:1;min-width:0}
.calc .ex{font-size:12px;color:var(--text-secondary);word-break:break-all;border-top:1px dashed var(--divider);padding-top:11px}
.calc .ctot{display:flex;align-items:baseline;margin-top:9px}
.calc .ctot .k{font-size:12px;color:var(--text-secondary)}
.calc .ctot .n{margin-left:auto;font-size:25px;font-weight:800;color:var(--brand-600)}
.calc .fee{margin-top:12px;padding:11px 13px;border-radius:var(--r-md);background:var(--bg-soft);font-size:12.5px}
.calc .fee .r{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-secondary)}
.calc .fee .r b{color:var(--text-primary)}
.calc .fee .r.tot{border-top:1px solid var(--divider);margin-top:5px;padding-top:8px;color:var(--text-primary);font-weight:600}
.calc .fee .r.tot b{color:var(--success);font-size:16px}
.calc .fee .n{font-size:11.5px;color:var(--text-muted);margin-top:6px}
.foot{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh);padding:14px 20px;display:flex;align-items:center;gap:11px}
.foot .sp{margin-left:auto;display:flex;gap:11px}
@media (max-width:980px){
  .main{grid-template-columns:1fr}
  .pwrap{flex-direction:column}
  .pside{width:100%;position:static}
  .sside{display:none}
  .smain{padding-left:0}
  .search{display:none}
}
</style>
</head>

function tierSum(t,f,to){let s=0;(t||[]).forEach(x=>{const lo=Math.max(x[0],f),hi=Math.min(x[1],to);if(hi>lo)s+=(hi-lo)*x[2]});return s;}
function covers(t,f,to){const ts=(t||[]).slice().sort((a,b)=>a[0]-b[0]);let c=f;for(const x of ts){if(x[0]>c)break;if(x[1]>c)c=x[1];if(c>=to)return true;}return c>=to;}
function detail(s,k,v){
  const card=s.card[k];if(!card)return null;const rs=rowsOf(k),fi=fixedIdx(k),r=rs[fi],p=v[fi];
  let base=0,txt='';
  if(r.role==='range'){base=tierSum(card.tiers,p.from,p.to);txt=`${rlab(r)} ${p.from}→${p.to} ${money(base)}`;}
  else{const u=card.once[p.val]||0;base=u*p.n;txt=`${vlab(r.vals.find(a=>a[0]===p.val))} ${money(u)} × ${p.n}`;}
  const fixed=base,adds=[],mults=[];
  rs.forEach((r2,i)=>{if(r2.kind!=='coef')return;selOf(r2,v[i]).forEach(val=>{const c=(card.coefs||{})[i+':'+val];if(!c)return;if(c[0]==='p')adds.push(c[1]);else if(c[1]!==1)mults.push(c[1]);});});
  let total=fixed;adds.forEach(a=>{total+=a;txt+=` + ${money(a)}`});mults.forEach(m=>{total+=fixed*(m-1);txt+=` + ${money(fixed)} × (${m} − 1)`});
  return {total,txt};
}
function canDo(s,k,v,meth){
  const card=s.card[k];if(!card||!s.methods.includes(meth))return false;
  return rowsOf(k).every((r,i)=>{
    if(r.role==='range')return v[i].to>v[i].from&&covers(card.tiers,v[i].from,v[i].to);
    if(r.role==='count')return card.once&&card.once[v[i].val]!==undefined;
    const sc=(card.scope||{})[i];if(!sc)return true;
    return selOf(r,v[i]).every(x=>x==='0'||sc.includes(x));});
}

const MULTV=['std','exp','sup','bs','tail','alch','ench','eng','skin','mining','herb'];
const S={step:1,svc:'level',tiers:null,coefOn:{},coefVal:{},coefMode:{},methods:[0,1],eta:240,warranty:1,pv:null};
function initSell(k){S.svc=k;const r=rowsOf(k)[fixedIdx(k)];
  if(r.role==='range'){const mid=Math.round((r.min+r.max)/2/r.step)*r.step;
    const base=r.max>=300?[0.2,0.35]:r.max<=14?[20,40]:[1.2,3.6];
    S.tiers=[[r.min,mid,base[0]],[mid,r.max,base[1]]];}
  else S.tiers=r.vals.map(v=>[v[0],9]);
  S.coefOn={};S.coefVal={};S.coefMode={};
  rowsOf(k).forEach((r2,i)=>{if(r2.kind!=='coef')return;r2.vals.forEach(v=>{if(v[0]==='0')return;
    const key=i+':'+v[0],isRealm=v[0].includes('-'),mult=MULTV.includes(v[0])||isRealm;
    S.coefOn[key]=true;S.coefMode[key]=mult?'x':'p';
    S.coefVal[key]=v[0]==='exp'?1.5:v[0]==='sup'?1.8:v[0]==='std'?1:
      isRealm?(v[0].includes('-RP-')?1.1:v[0].startsWith('EU')?1.05:1):
      mult?1.2:v[0]==='1'?25:v[0]==='2'?8:v[0]==='seller'?40:5;});});
  S.pv=defV(k);}
initSell('level');
function sellBase(){const k=S.svc,fi=fixedIdx(k),r=rowsOf(k)[fi],p=S.pv[fi];
  if(r.role==='range')return tierSum(S.tiers.map(x=>[x[0],x[1],+x[2]||0]),p.from,p.to);
  const t=S.tiers.find(x=>x[0]===p.val);return (t?+t[1]:0)*p.n;}
function sellPrice(){const base=sellBase();let total=base;const k=S.svc;
  rowsOf(k).forEach((r,i)=>{if(r.kind!=='coef')return;selOf(r,S.pv[i]).forEach(v=>{const key=i+':'+v;
    if(v==='0'||!S.coefOn[key])return;
    if(S.coefMode[key]==='p')total+=+S.coefVal[key]||0;else total+=base*((+S.coefVal[key]||1)-1);});});
  return total;}

function setTier(i,j,v){S.tiers[i][j]=+v;const r=rowsOf(S.svc)[fixedIdx(S.svc)];
  if(r.role==='range'&&j===1){if(S.tiers[i+1])S.tiers[i+1][0]=+v;S.tiers[S.tiers.length-1][1]=r.max;}renderSell();}
function addTier(){const r=rowsOf(S.svc)[fixedIdx(S.svc)],last=S.tiers[S.tiers.length-1];if(last[1]-last[0]<=r.step)return;
  const mid=Math.round((last[0]+last[1])/2/r.step)*r.step;S.tiers[S.tiers.length-1]=[last[0],mid,last[2]];S.tiers.push([mid,r.max,(+last[2]||1)*2]);renderSell();}
function delTier(i){if(S.tiers.length<2)return;const r=rowsOf(S.svc)[fixedIdx(S.svc)];S.tiers.splice(i,1);S.tiers[0][0]=r.min;
  for(let j=1;j<S.tiers.length;j++)S.tiers[j][0]=S.tiers[j-1][1];S.tiers[S.tiers.length-1][1]=r.max;renderSell();}
function toggleM(v){S.methods=S.methods.includes(v)?S.methods.filter(x=>x!==v):S.methods.concat(v);if(!S.methods.length)S.methods=[v];renderSell();}

  $('crumbBuy').innerHTML=L('crumbBuy');$('gTitle').textContent=L('gtitle');
  $('gBadges').innerHTML=L('badges').map((b,i)=>`<span class="${i===0?'g':''}">${b}</span>`).join('');
  $('tabNote').innerHTML='<b>设计说明：</b>tab = 中台关键属性「服务类型」的取值；没配置模板的取值不显示（团本 12/9、PvP 官方公布规则后由运营开启）。服务器组合（大区 × 规则 × 阵营 共 12 个取值）作为计价属性，卖家勾选能接的组合并各自定价。大分类下只有一个模板时不显示小分类行。';
  renderTabs();B.tab==='custom'?renderCustom():renderStd();renderSell();
}
$('langSeg').onclick=e=>{const l=e.target.dataset.l;if(!l)return;LANG=l;
  document.documentElement.lang=l==='zh'?'zh-CN':'en';
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));renderAll();};
$('sideSeg').onclick=e=>{const v=e.target.dataset.s;if(!v)return;
  document.querySelectorAll('#sideSeg button').forEach(b=>b.classList.toggle('on',b.dataset.s===v));
  $('vSell').classList.toggle('hidden',v!=='sell');$('vBuy').classList.toggle('hidden',v!=='buy');};
$('btnNext').onclick=()=>{if(S.step<3){S.step++;renderSell();}else alert('演示：提交审核');};
$('btnBack').onclick=()=>{if(S.step>1){S.step--;renderSell();}};
function refresh(){if(B.tab!=='custom'&&!typesOn().find(x=>x[0]===B.tab))B.tab=typesOn()[0][0];
  if(B.tab!=='custom'&&!tplOn(B.svc))setSvc(typesOn().find(x=>x[0]===B.tab)[2][0],true);
  if(!TPL[S.svc]||!tplOn(S.svc))initSell('level');
  setTab(B.tab);renderSell();}
$('cfgRaid').onchange=e=>{CFG.raid=e.target.checked;refresh();};
$('cfgPvp').onchange=e=>{CFG.pvp=e.target.checked;refresh();};
$('cfgNotes').onchange=e=>document.body.classList.toggle('notes',e.target.checked);
B.v=defV('level');
C.items=[{svc:'level',v:defV('level')},{svc:'pf_mining',v:defV('pf_mining')}];
renderAll();
</script>
</body>
</html>
