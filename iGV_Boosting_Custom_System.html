<style>
  :root{--ink:#1f2329;--soft:#5c6470;--dim:#9aa3af;--line:#e8eaed;--orange:#f1652a;--blue:#2f6fe0;
    --sans:-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#0d1424;font:13px/1.6 var(--sans);color:var(--ink);display:flex;flex-direction:column}
  .switchbar{flex:none;height:52px;background:#0d1424;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #22304d}
  .switchbar .ttl{color:#fff;font-weight:700;font-size:14px;letter-spacing:.01em;white-space:nowrap}
  .switchbar .ttl small{display:block;font-size:10.5px;color:#7d89a3;font-weight:500;letter-spacing:.04em;margin-top:-2px}
  .pills{display:flex;gap:8px;margin-left:14px}
  .pill{display:flex;align-items:center;gap:8px;padding:7px 15px;border-radius:20px;background:#182338;color:#a9b4c9;font-size:12.5px;cursor:pointer;border:1px solid transparent;white-space:nowrap;user-select:none}
  .pill:hover{background:#1e2b45;color:#e6ebf4}
  .pill.on{background:#fff;color:var(--ink);font-weight:700;border-color:#fff}
  .pill .tag{font-size:10px;font-weight:800;border-radius:3px;padding:1px 6px;letter-spacing:.03em}
  .pill .tag.n{background:var(--orange);color:#fff}
  .pill .tag.o{background:#3b4a68;color:#c3cbdd}
  .pill.on .tag.o{background:#e8eaed;color:var(--soft)}
  .switchbar .note{margin-left:auto;color:#7d89a3;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage{flex:1;min-height:0;position:relative;background:#f0f2f5}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#f0f2f5}
  iframe.on{display:block}
  @media(max-width:820px){.switchbar .note{display:none}}
</style>
</head>

</div>

<div class="stage">
  <iframe id="fnew" class="on"></iframe>
  <iframe id="fold"></iframe>
</div>

<script type="text/plain" id="src-new"><!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iGV 后台 · Custom 新方案原型</title>
<style>
  :root{
    --nav:#1f2a44;--nav-hover:#28345a;--nav-on:#1d6fe0;--nav-txt:#c3cbdd;
    --ink:#1f2329;--soft:#5c6470;--dim:#9aa3af;--line:#e8eaed;--bg:#f0f2f5;
    --blue:#2f6fe0;--blue-d:#1d5fd0;--blue-l:#eaf1fc;
    --orange:#f1652a;--orange-d:#d9531c;--orange-soft:#fdeee7;
    --green:#12855a;--green-l:#e7f4ee;--amber:#b8791b;--amber-l:#fbf1dc;--red:#d64545;--red-l:#fdecec;
    --purple:#7048b6;--purple-l:#f0ebfa;
    --sans:-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  .topbar{height:56px;background:#141c30;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:30}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:#fff}
  .logo .mark{width:28px;height:28px;border-radius:7px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800}
  .logo small{display:block;font-size:7.5px;letter-spacing:.16em;color:#8d97ac;font-weight:600;margin-top:-2px}
  .topbar .sp{flex:1}
  .userbox{display:flex;align-items:center;gap:9px;color:#dfe4ee;font-size:13px}
  .userbox .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7d8aa8,#c9d1e0)}

  .shell{display:flex;align-items:stretch;min-height:calc(100vh - 56px)}
  .side{width:210px;flex:none;background:var(--nav);padding:10px 0 40px}
  .grp{margin-bottom:2px}
  .grp>.gh{display:flex;align-items:center;gap:10px;padding:12px 18px;color:#e8ecf5;font-size:13.5px;cursor:pointer;user-select:none}
  .grp>.gh .ic{width:16px;text-align:center;opacity:.85}
  .grp>.gh .car{margin-left:auto;font-size:10px;color:#8d97ac;transition:transform .15s}
  .grp.open>.gh .car{transform:rotate(180deg)}
  .sub{display:none}.grp.open .sub{display:block}
  .sub a{display:block;padding:10px 18px 10px 44px;color:var(--nav-txt);font-size:13px;cursor:pointer;text-decoration:none}
  .sub a:hover{background:var(--nav-hover);color:#fff}
  .sub a.on{background:var(--nav-on);color:#fff;font-weight:600}

  .main{flex:1;min-width:0;padding:14px 18px 40px}
  .crumbrow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .crumb{font-size:13px;color:var(--soft)}.crumb b{color:var(--ink);font-weight:500}
  .crumbrow .sp{flex:1}
  .shopsw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
  .sel,.inp{border:1px solid #d9dde3;border-radius:4px;padding:6px 10px;font:13px var(--sans);background:#fff;color:var(--ink);min-width:130px}
  .sel{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9aa3af 50%),linear-gradient(135deg,#9aa3af 50%,transparent 50%);background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
  .inp::placeholder{color:#b9c0ca}

  .card{background:#fff;border-radius:6px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.frow+.frow{margin-top:12px}
  .fl{font-size:13px;color:var(--soft);white-space:nowrap}
  .btns{margin-left:auto;display:flex;gap:8px}
  .btn{border:1px solid #d9dde3;background:#fff;border-radius:4px;padding:6px 16px;font-size:13px;cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.pri:hover{background:var(--blue-d);color:#fff}
  .btn.sm{padding:4px 12px;font-size:12.5px}

  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:-4px -18px 14px;padding:0 18px;overflow-x:auto}
  .tab{padding:11px 16px;font-size:14px;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
  .tab .cnt{font-size:11px;background:#eef0f3;color:var(--soft);border-radius:9px;padding:0 6px;margin-left:5px}
  .tab.on .cnt{background:var(--blue-l);color:var(--blue)}

  .twrap{background:#fff;border-radius:6px;overflow:auto;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  thead th{background:#fafafa;color:var(--soft);font-weight:600;white-space:nowrap;position:sticky;top:0}
  tbody tr:hover{background:#fafcff}
  tbody tr.cus{background:#fbfaff}
  tbody tr.cus:hover{background:#f6f4fe}
  .thumb{width:64px;height:44px;border-radius:4px;background:#2a2f3a;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
  .pname{max-width:250px;line-height:1.5}
  .lnk{color:var(--blue);cursor:pointer}.lnk:hover{text-decoration:underline}
  .muted{color:var(--dim)}
  .nowrap{white-space:nowrap}
  .stt{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .st-pay .dot{background:var(--amber)}.st-pay{color:var(--amber)}
  .st-risk .dot{background:var(--purple)}.st-risk{color:var(--purple)}
  .st-pool .dot{background:var(--blue)}.st-pool{color:var(--blue)}
  .st-run .dot{background:var(--blue)}.st-run{color:var(--blue)}
  .st-done .dot{background:var(--green)}.st-done{color:var(--green)}
  .st-close .dot{background:var(--red)}.st-close{color:var(--red)}
  .st-up .dot{background:var(--green)}.st-up{color:var(--green)}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;padding:1px 6px;vertical-align:1px;white-space:nowrap}
  .bg-cus{background:var(--purple-l);color:var(--purple);border:1px solid #ddd0f2}
  .bg-self{background:var(--amber-l);color:var(--amber);border:1px solid #efdcae}
  .substat{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap}
  .code{font-family:var(--mono);font-size:11.5px;background:#f2f4f7;border-radius:3px;padding:1px 5px;color:#334}
  .qty-enc{color:var(--purple);font-weight:700}
  .warnmark{color:var(--red);font-weight:700;cursor:help}

  .annobar{background:#fff;border-radius:6px;padding:11px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(0,0,0,.04);border-left:3px solid var(--orange)}
  .annobar .t{font-weight:700;font-size:13px}
  .annobar .d{font-size:12.5px;color:var(--soft);flex:1;min-width:220px}
  .swt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soft);cursor:pointer;user-select:none}
  .chk{width:14px;height:14px;accent-color:var(--blue)}
  .anno{display:none}body.showanno .anno{display:inline-block}
  body.showanno .annoblk{display:block}.annoblk{display:none}
  .ntag{font-size:10px;font-weight:800;background:var(--orange);color:#fff;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;letter-spacing:.03em}
  .anonote{background:var(--orange-soft);border:1px solid #f7d7c7;border-radius:6px;padding:10px 13px;font-size:12.5px;color:#8a5a2a;margin:0 0 14px;line-height:1.75}
  .anonote b{color:var(--orange-d)}
  .risknote{background:var(--red-l);border:1px solid #f3c9c9;border-radius:6px;padding:10px 13px;font-size:12.5px;color:#8c2f2f;margin:0 0 14px;line-height:1.75}
  .risknote b{color:#b32d2d}

  .selfv{position:relative}
  body.showanno .selfv{background:var(--orange-soft);border-bottom:1px dashed var(--orange);border-radius:3px;padding:1px 3px}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 4px 0;color:var(--soft);font-size:12.5px}
  .pg{border:1px solid #d9dde3;border-radius:4px;padding:4px 10px;background:#fff;cursor:pointer}
  .pg.on{border-color:var(--blue);color:var(--blue)}

  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(12px);background:#232a36;color:#fff;padding:13px 20px;border-radius:8px;font-size:13px;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.18s;z-index:80;max-width:640px;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .tsub{font-size:11.5px;color:#aab3c2}
  /* ---------- 顶部视图切换 + 方案说明 ---------- */
  .vtabs{background:#141c30;display:flex;gap:2px;padding:0 20px}
  .vtab{padding:9px 18px;font-size:13px;color:#aeb8cc;cursor:pointer;border-radius:6px 6px 0 0}
  .vtab:hover{color:#fff}
  .vtab.on{background:var(--bg);color:var(--ink);font-weight:600}
  .doc{padding:18px 22px 60px;max-width:1280px}
  .doc h1{font-size:20px;margin:0 0 6px}
  .doc .lead{font-size:13.5px;color:var(--soft);margin:0 0 20px;line-height:1.8}
  .doc h2{font-size:15px;margin:26px 0 10px;padding-left:9px;border-left:3px solid var(--orange)}
  .flowwrap{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:auto;padding:2px}
  .flow{display:grid;grid-template-columns:118px repeat(6,minmax(168px,1fr));min-width:1140px;font-size:12px}
  .flow>div{padding:11px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .flow>div:nth-child(7n){border-right:none}
  .flow .rh{background:#fafafa;color:var(--soft);font-weight:600;white-space:nowrap}
  .flow .step{background:#f6f8fc;font-weight:600;color:var(--ink);line-height:1.5}
  .flow .step .n{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:50%;background:var(--blue);color:#fff;font-size:10.5px;margin-right:6px}
  .flow .self{background:var(--orange-soft)}
  .flow .switch{background:#fff8ec;box-shadow:inset 3px 0 0 var(--orange)}
  .flow .sm{font-size:11px;color:var(--dim);display:block;margin-top:2px;line-height:1.5}
  .flow .mono{font-family:var(--mono);font-size:11px}
  .branch{margin-top:12px;background:var(--red-l);border:1px solid #f3c9c9;border-radius:6px;padding:12px 15px;font-size:12.5px;color:#8c2f2f;line-height:1.85}
  .branch b{color:#b32d2d}
  @media(max-width:1100px){.side{width:64px}.side .gh span:not(.ic):not(.car),.sub a{font-size:0}.sub a{padding-left:18px}}
</style>
</head>
<body class="showanno">

<div class="topbar">
  <div class="logo"><span class="mark">iG</span><div>iGV.com<small>GAMER VALUE</small></div></div>
  <div class="sp"></div>
  <div class="userbox"><span class="av"></span><span>赵梁 ▾</span></div>
</div>

<div class="vtabs">
  <div class="vtab on" data-view="proto">原型</div>
  <div class="vtab" data-view="doc">方案说明</div>
</div>

<div class="shell">
  <aside class="side">
    <div class="grp open">
      <div class="gh"><span class="ic">▤</span><span>商品管理</span><span class="car">▾</span></div>
      <div class="sub"><a>选品</a><a data-page="prod">已选商品</a><a>前端类目管理</a></div>
    </div>
    <div class="grp open">
      <div class="gh"><span class="ic">▤</span><span>订单管理</span><span class="car">▾</span></div>
      <div class="sub">
        <a class="on" data-page="order">订单列表</a>
        <a>争议订单</a><a>风控订单</a><a>退款单</a><a>验号订单</a><a>理赔单审核列表</a><a>保险单列表</a>
      </div>
    </div>
    <div class="grp"><div class="gh"><span class="ic">▤</span><span>买家管理</span><span class="car">▾</span></div><div class="sub"><a>买家列表</a></div></div>
    <div class="grp"><div class="gh"><span class="ic">▤</span><span>卖家管理</span><span class="car">▾</span></div><div class="sub"><a>卖家列表</a></div></div>
    <div class="grp"><div class="gh"><span class="ic">▤</span><span>商城管理</span><span class="car">▾</span></div><div class="sub"><a>商城配置</a></div></div>
    <div class="grp"><div class="gh"><span class="ic">▤</span><span>风控管理</span><span class="car">▾</span></div><div class="sub"><a>风控规则</a></div></div>
    <div class="grp"><div class="gh"><span class="ic">▤</span><span>SEO管理</span><span class="car">▾</span></div><div class="sub"><a>SEO配置</a></div></div>
    <div class="grp"><div class="gh"><span class="ic">▤</span><span>消息管理</span><span class="car">▾</span></div><div class="sub"><a>消息列表</a></div></div>
  </aside>

  <main class="main">

    <div class="annobar">
      <span class="t">新方案</span>
      <span class="d">不新增需求列表 —— 代练需求从下单那一刻就是一笔正式订单。未接单期间卖家挂<b>代练自营</b>系统账号,接单后改成实际卖家。橙色标记处为本方案<b>新增/改动</b>的部分。</span>
      <label class="swt"><input type="checkbox" id="annoSw" class="chk" checked> 显示方案标注</label>
    </div>

    <!-- ==================== 订单列表 ==================== -->
    <section id="page-order">
      <div class="crumbrow"><span class="crumb">订单管理 / <b>订单列表</b></span></div>

      <div class="anonote annoblk">
        <b>这一页要看的:</b>紫色底的行是代练自定义需求订单 —— <b>字段、状态、Tab 全部沿用订单列表原有的</b>,没有新增任何列和筛选项。<br>
        状态只用现有四种:<span class="code">待支付</span> / <span class="code">未完成</span> / <span class="code">已完成</span> / <span class="code">交易已取消</span>;
        <b>支付后的风控中、过风控待接单,都归在「未完成」里</b>。<br>
        未接单期间,<b>卖家店铺 / 卖家ID / 卖家邮箱三列填自营账号的值</b>,接单后改写成实际卖家。金额靠 <span class="code">$1.00 × 数量</span> 编码,不占列。

        <div class="tabs" id="otabs"></div>

          <span class="fl">订单号:</span><input class="inp" placeholder="请输入">
          <span class="fl">母单号:</span><input class="inp" placeholder="请输入">
          <span class="fl">第三方支付单号:</span><input class="inp" placeholder="请输入">
          <select class="sel"><option>卖家店铺</option></select><input class="inp" placeholder="请输入">
        </div>
        <div class="frow">
          <span class="fl">买家ID:</span><input class="inp" placeholder="请输入">
          <span class="fl">支付方式:</span><select class="sel"><option>全部</option></select>
          <div class="btns"><button class="btn pri">查询</button><button class="btn pri">高级筛选</button></div>
        </div>
      </div>

      <div class="twrap">
        <table>
          <thead><tr>
            <th style="min-width:196px">订单号 / 母单号</th><th style="min-width:88px">状态</th>
            <th class="nowrap">订单创建时间</th><th class="nowrap">订单更新时间</th><th>品牌</th><th>品类</th>
            <th>订单金额</th><th>卖家店铺</th><th>卖家ID</th><th>卖家邮箱</th>
            <th>递送状态</th><th>买家ID</th><th>买家邮箱</th>
          </tr></thead>
          <tbody id="orderBody"></tbody>
        </table>
      </div>
      <div class="pager"><span id="ordCount"></span><span class="pg">‹</span><span class="pg on">1</span><span class="pg">›</span></div>
    </section>

    <!-- ==================== 已选商品 ==================== -->
    <section id="page-prod" style="display:none">
      <div class="crumbrow">
        <span class="crumb">商品管理 / <b>已选商品</b></span>
        <span class="sp"></span>
        <span class="shopsw">商城切换:<select class="sel"><option>自营</option></select></span>
      </div>

      <div class="anonote annoblk">
        <b>这一页要看的:</b>Custom 不再动态生成商品 —— 由<b>自营账号提前上架一个「单位商品」</b>(第一行,黄底),价格固定 <span class="code">1.00 USD</span>,正常上架、正常可售。买家出价多少,下单时数量就是多少。
      </div>

      <div class="risknote annoblk">
        <b>⚠ 已知副作用:</b>这个商品的<b>「销量」变成了金额总和</b>(下表显示 1,247 = 累计成交 $1,247),不再是件数。库存同理需填极大值、预警失效。
        <b>建议给该商品打一个标记,在销量排行、品类销量报表、库存预警里排除它。</b>
      </div>

      <div class="card">
        <div class="frow">

    --green:#12855a;--green-l:#e7f4ee;--amber:#b8791b;--amber-l:#fbf1dc;--red:#d64545;--red-l:#fdecec;
    --sans:-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 var(--sans);-webkit-font-smoothing:antialiased}

  /* ---------- top bar ---------- */
  .topbar{height:56px;background:#141c30;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:30}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:#fff}
  .logo .mark{width:28px;height:28px;border-radius:7px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800}
  .logo small{display:block;font-size:7.5px;letter-spacing:.16em;color:#8d97ac;font-weight:600;margin-top:-2px}
  .topbar .sp{flex:1}
  .userbox{display:flex;align-items:center;gap:9px;color:#dfe4ee;font-size:13px}
  .userbox .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7d8aa8,#c9d1e0)}

  /* ---------- layout ---------- */
  .shell{display:flex;align-items:stretch;min-height:calc(100vh - 56px)}
  .side{width:210px;flex:none;background:var(--nav);padding:10px 0 40px}
  .grp{margin-bottom:2px}
  .grp>.gh{display:flex;align-items:center;gap:10px;padding:12px 18px;color:#e8ecf5;font-size:13.5px;cursor:pointer;user-select:none}
  .grp>.gh .ic{width:16px;text-align:center;opacity:.85}
  .grp>.gh .car{margin-left:auto;font-size:10px;color:#8d97ac;transition:transform .15s}
  .grp.open>.gh .car{transform:rotate(180deg)}
  .sub{display:none}
  .grp.open .sub{display:block}
  .sub a{display:block;padding:10px 18px 10px 44px;color:var(--nav-txt);font-size:13px;cursor:pointer;text-decoration:none}
  .sub a:hover{background:var(--nav-hover);color:#fff}
  .sub a.on{background:var(--nav-on);color:#fff;font-weight:600}

  .main{flex:1;min-width:0;padding:14px 18px 40px}
  .crumbrow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .crumb{font-size:13px;color:var(--soft)}
  .crumb b{color:var(--ink);font-weight:500}
  .crumbrow .sp{flex:1}
  .shopsw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
  .sel,.inp{border:1px solid #d9dde3;border-radius:4px;padding:6px 10px;font:13px var(--sans);background:#fff;color:var(--ink);min-width:130px}
  .sel{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9aa3af 50%),linear-gradient(135deg,#9aa3af 50%,transparent 50%);background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
  .inp::placeholder{color:#b9c0ca}

  .card{background:#fff;border-radius:6px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .frow+.frow{margin-top:12px}
  .fl{font-size:13px;color:var(--soft);white-space:nowrap}
  .btns{margin-left:auto;display:flex;gap:8px}
  .btn{border:1px solid #d9dde3;background:#fff;border-radius:4px;padding:6px 16px;font-size:13px;cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.pri:hover{background:var(--blue-d);color:#fff}
  .btn.sm{padding:4px 12px;font-size:12.5px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn[disabled]:hover{border-color:#d9dde3;color:var(--ink)}

  /* tabs */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:-4px -18px 14px;padding:0 18px}
  .tab{padding:11px 18px;font-size:14px;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}

  /* table */
  .twrap{background:#fff;border-radius:6px;overflow:auto;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  thead th{background:#fafafa;color:var(--soft);font-weight:600;white-space:nowrap;position:sticky;top:0}
  tbody tr:hover{background:#fafcff}
  tbody tr.sys{background:#fffaf6}
  tbody tr.sys:hover{background:#fff5ee}
  .thumb{width:64px;height:44px;border-radius:4px;object-fit:cover;background:#2a2f3a;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
  .pname{max-width:230px;line-height:1.5}
  .lnk{color:var(--blue);cursor:pointer}
  .lnk:hover{text-decoration:underline}
  .muted{color:var(--dim)}
  .nowrap{white-space:nowrap}
  .stt{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .st-up .dot{background:var(--green)}.st-up{color:var(--green)}
  .st-off .dot{background:#b9c0ca}.st-off{color:var(--dim)}
  .st-pay .dot{background:var(--amber)}.st-pay{color:var(--amber)}
  .st-run .dot{background:var(--blue)}.st-run{color:var(--blue)}
  .st-done .dot{background:var(--green)}.st-done{color:var(--green)}
  .st-close .dot{background:var(--red)}.st-close{color:var(--red)}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;padding:1px 6px;vertical-align:1px;white-space:nowrap}
  .bg-cus{background:var(--blue-l);color:var(--blue);border:1px solid #cfe0f8}
  .chk{width:14px;height:14px;accent-color:var(--blue)}
  .substat{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap}
  .btn.danger{color:var(--red);border-color:#f0c2c2;white-space:nowrap}
  .btn.danger:hover{border-color:var(--red);color:var(--red);background:#fff6f6}

  /* annotation */
  .annobar{background:#fff;border-radius:6px;padding:11px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(0,0,0,.04);border-left:3px solid var(--orange)}
  .annobar .t{font-weight:700;font-size:13px}
  .annobar .d{font-size:12.5px;color:var(--soft);flex:1;min-width:220px}
  .swt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soft);cursor:pointer;user-select:none}
  .vtabs{display:inline-flex;border:1px solid #d9dde3;border-radius:5px;overflow:hidden;flex:none}
  .vtab{padding:5px 14px;font-size:12.5px;font-weight:600;color:var(--soft);cursor:pointer;background:#fff;user-select:none}
  .vtab+.vtab{border-left:1px solid #d9dde3}
  .vtab.on{background:var(--ink);color:#fff}
  /* 方案说明 */
  .doc{max-width:940px}
  .dlead{font-size:13.5px;color:var(--soft);margin:0 0 20px;line-height:1.8}
  .dh2{font-size:15px;margin:26px 0 10px;padding-left:9px;border-left:3px solid var(--orange)}
  .flowwrap{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:auto;padding:2px}
  .flow{display:grid;grid-template-columns:118px repeat(6,minmax(168px,1fr));min-width:1140px;font-size:12px}
  .flow>div{padding:11px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .flow>div:nth-child(7n){border-right:none}
  .flow .rh{background:#fafafa;color:var(--soft);font-weight:600;white-space:nowrap}
  .flow .step{background:#f6f8fc;font-weight:600;color:var(--ink);line-height:1.5}
  .flow .step .n{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:50%;background:var(--blue);color:#fff;font-size:10.5px;margin-right:6px}
  .flow .reqzone{background:var(--blue-l)}
  .flow .switch{background:#fff8ec;box-shadow:inset 3px 0 0 var(--orange)}
  .flow .sm{font-size:11px;color:var(--dim);display:block;margin-top:2px;line-height:1.5}
  .branch{margin-top:12px;background:var(--red-l);border:1px solid #f3c9c9;border-radius:6px;padding:12px 15px;font-size:12.5px;color:#8c2f2f;line-height:1.85}
  .branch b{color:#b32d2d}

  .doccard{background:#fff;border-radius:6px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .doccard h3{margin:0 0 4px;font-size:15px}
  .doccard .csub{color:var(--soft);font-size:12.5px;margin:0 0 14px}
  .doccard h3 .num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:var(--ink);color:#fff;font-size:11px;margin-right:8px;vertical-align:1px}
  .lead{background:var(--blue-l);border:1px solid #cfe0f8;border-radius:6px;padding:13px 16px;font-size:13px;color:#25406e;line-height:1.75;margin-bottom:14px}
  .lead b{color:#14294d}
  .dtable{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .dtable th,.dtable td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top}
  .dtable th:last-child,.dtable td:last-child{border-right:none}
  .dtable thead th{background:#fafafa;color:var(--soft);font-weight:600;white-space:nowrap}
  .dtable tbody tr:last-child td{border-bottom:none}
  .dtable td.k{white-space:nowrap;font-weight:600}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:3px;padding:1px 7px;white-space:nowrap}
  .p-none{background:var(--green-l);color:var(--green)}
  .p-new{background:var(--orange-soft);color:var(--orange-d)}
  .p-min{background:var(--blue-l);color:var(--blue)}
  .steps{counter-reset:st;margin:0;padding:0;list-style:none}
  .steps li{position:relative;padding-left:26px;margin:9px 0;font-size:13px;color:var(--soft);line-height:1.7}
  .steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;background:#eef0f3;color:var(--soft);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .steps li b{color:var(--ink)}
  .code{font-family:var(--mono);font-size:11.5px;background:#f2f4f7;border-radius:4px;padding:1px 6px;color:#334}
  .todo{background:var(--amber-l);border:1px solid #efdcae;border-radius:6px;padding:12px 15px;font-size:12.5px;color:#7a5510;line-height:1.8}
  .todo b{color:#5c3f08}
  .anno{display:none}
  body.showanno .anno{display:inline-block}
  body.showanno .annoblk{display:block}
  .annoblk{display:none}
  .ntag{font-size:10px;font-weight:800;background:var(--orange);color:#fff;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;letter-spacing:.03em}
  .anonote{background:var(--orange-soft);border:1px solid #f7d7c7;border-radius:6px;padding:10px 13px;font-size:12.5px;color:#8a5a2a;margin:0 0 14px}
  .anonote b{color:var(--orange-d)}

  .pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 4px 0;color:var(--soft);font-size:12.5px}
  .pg{border:1px solid #d9dde3;border-radius:4px;padding:4px 10px;background:#fff;cursor:pointer}
  .pg.on{border-color:var(--blue);color:var(--blue)}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 20px;overflow:auto}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:8px;width:100%;max-width:720px;box-shadow:0 12px 48px rgba(0,0,0,.24)}
  .mhead{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
  .mhead h3{margin:0;font-size:16px}
  .mhead .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:16px}
  .mbody{padding:6px 20px 18px}
  .sec{margin-top:14px}
  .sec .sh{font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.03em;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .kv{display:grid;grid-template-columns:104px 1fr;gap:6px 14px;font-size:12.5px}
  .kv .k{color:var(--soft)}
  .kv .v{color:var(--ink)}
  .kv .v.mono{font-family:var(--mono);font-size:12px}
  .chain{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-top:4px}
  .cn{border:1px solid var(--line);border-radius:6px;padding:9px 12px;flex:1;min-width:150px;background:#fafbfc}
  .cn .ck{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
  .cn .cv{font-size:12.5px;font-weight:600;margin-top:3px;font-family:var(--mono)}
  .cn .cd{font-size:11.5px;color:var(--soft);margin-top:3px}
  .cn.req{background:var(--blue-l);border-color:#cfe0f8}
  .cn.sys{background:var(--orange-soft);border-color:#f7d7c7}
  .cn.pend{background:#fafbfc;border-style:dashed;color:var(--dim)}
  .cn.pend .cv{color:var(--dim)}
  .car2{display:flex;align-items:center;color:var(--dim);padding:0 7px;flex:none;font-size:15px}
  .combo{border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .combo .cr{display:flex;justify-content:space-between;padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
  .combo .cr:last-child{border-bottom:none}
  .combo .cr.tot{background:#fafbfc;font-weight:700}
  .free{background:#fafbfc;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--soft);line-height:1.65}
  @media(max-width:1100px){.side{width:64px}.side .gh span:not(.ic):not(.car),.sub a{font-size:0}.sub a{padding-left:18px}}
  @media(max-width:760px){.chain{flex-direction:column}.car2{transform:rotate(90deg);padding:5px 0;justify-content:center}}
</style>
</head>

      <h1 style="font-size:20px;margin:0 0 6px">旧方案 · 代练自定义需求怎么流转</h1>
      <p class="dlead">
        一句话:<b>需求单独建一个域(需求列表)</b>，买家发布并付款后先活在需求域里；<b>卖家接单的那一瞬间</b>，系统生成一个隐藏的「影子商品」承载交易参数，同时生成订单并把已托管的资金挂上去。<br>
        <b>订单列表里只会出现已被接单的 Custom 订单</b>，未接单的需求不进订单列表。
      </p>

        <div class="step"><span class="n">3</span>待接单<span class="sm">进入卖家接单大厅</span></div>
        <div class="step"><span class="n">4</span>卖家接单<span class="sm">生成影子商品 + 生成订单</span></div>
        <div class="step"><span class="n">5</span>交付 / 验收<span class="sm">上号代打或组队陪同</span></div>
        <div class="step"><span class="n">6</span>完成 / 结算<span class="sm">买家确认或超时自动确认</span></div>

        <div class="rh">系统动作</div>
        <div>生成<b>需求编号 BR…</b>，调起收银台，款项进<b>托管</b></div>
        <div>机审直接放行 → 待接单；命中规则 → 转人工，运营在需求列表<b>通过 / 取消</b></div>
        <div>需求上架接单大厅，卖家端 Request List 可见</div>
        <div><b>同一事务</b>里做三件事:生成影子商品(隐藏)、生成订单、把已托管资金挂到订单上</div>

    req:'练到满级后把巅峰刷到 200,再打墨菲斯托 5 次(痛苦 4)。',note:'尽量晚上开工(欧洲时间)。'
  },
  'BR20260826-0068':{

    audit:'机审转人工 · 已人工通过(命中「价格偏离」)',price:'34.00 USD',offers:1,
    seller:'Best_For_U (117582821)',accept:'14:41:15 8/26/2026',

};

/* ---------------- render: products ---------------- */
function renderProducts(){
  var list=PRODUCTS;
  document.getElementById('prodBody').innerHTML=list.map(function(p){
    var stTenant='<span class="stt st-up"><i class="dot"></i>上架</span>';
    var stSeller='<span class="stt st-up"><i class="dot"></i>可售</span>';
    var nameHtml=p.name;
    var prev='<button class="btn pri sm">预览</button>';
    var box='<input type="checkbox" class="chk">';
    return '<tr>'+
      '<td>'+box+'</td>'+
      '<td><div class="thumb">'+p.img+'</div></td>'+
      '<td class="pname">'+nameHtml+'</td>'+
      '<td>'+p.cat+'</td><td>'+p.brand+'</td><td>'+p.shop+'</td>'+
      '<td class="nowrap">'+p.time+'</td><td class="nowrap">'+p.price+'</td>'+
      '<td>'+stTenant+'</td><td>'+stSeller+'</td><td>'+p.ins+'</td><td>'+p.sold+'</td><td>'+prev+'</td></tr>';
  }).join('');
  document.getElementById('prodCount').textContent='共 '+list.length+' 条';
}

/* ---------------- render: orders ---------------- */
function renderOrders(){
  var mode=document.getElementById('osrcSel').value;
  var list=ORDERS.filter(function(o){
    if(mode==='mall') return !o.custom;
    if(mode==='custom') return o.custom;
    return true;
  });
  document.getElementById('orderBody').innerHTML=list.map(function(o){
    var reqLine=o.custom
      ? '<div style="margin-top:4px">需求编号:<span class="lnk" data-req="'+o.req+'">'+o.req+'</span> <span class="badge bg-cus">自定义需求</span><span class="ntag anno">NEW</span></div>'
      : '';
    return '<tr>'+
      '<td><div>订单号:'+o.no+'</div><div class="muted">母单号:'+o.mo+'</div>'+reqLine+
        '<div style="margin-top:5px"><span class="lnk">复制</span> &nbsp; <span class="lnk">订单详情</span></div></td>'+
      '<td><span class="stt '+o.stc+'"><i class="dot"></i>'+o.st+'</span></td>'+
      '<td class="nowrap">'+o.ct+'</td><td class="nowrap">'+o.ut+'</td>'+
      '<td>'+o.brand+'</td><td>'+o.cat+'</td><td class="nowrap">'+o.amt+'</td>'+
      '<td>'+o.shop+'</td><td>'+o.sid+'</td><td>'+(o.ship||'<span class="muted">—</span>')+'</td><td>'+o.bid+'</td></tr>';
  }).join('');
  document.getElementById('ordCount').textContent='共 '+list.length+' 条';
}

/* ---------------- render: requests ---------------- */
var reqTab='all';
function renderRequests(){
  var list=REQUESTS.filter(function(r){return reqTab==='all'||r.st===reqTab;});
  document.getElementById('reqBody').innerHTML=list.length?list.map(function(r){
    var ord=r.order
      ? '<span class="lnk" data-order="'+r.order+'">'+r.order.slice(0,10)+'…</span>'
      : '<span class="muted">尚未生成</span>';
    var sub=r.by?('<div class="substat">'+r.by+'</div>'):'';
    var actionable=(r.st==='审核中'||r.st==='待接单');
    var box=actionable
      ? '<input type="checkbox" class="chk reqchk" data-no="'+r.no+'">'
      : '<input type="checkbox" class="chk" disabled title="该状态下无可执行操作">';
    return '<tr>'+
      '<td>'+box+'</td>'+
      '<td><span class="lnk" data-req="'+r.no+'">'+r.no+'</span></td>'+
      '<td><span class="stt '+r.stc+'"><i class="dot"></i>'+r.st+'</span>'+sub+'</td>'+
      '<td>'+r.bid+'</td><td>'+r.brand+'</td><td>'+r.cat+'</td>'+
      '<td class="nowrap">'+r.price+'</td>'+
      '<td class="nowrap"><span class="stt '+(r.pay==='已托管'?'st-done':'st-off')+'"><i class="dot"></i>'+r.pay+'</span></td>'+
      '<td class="nowrap">'+r.limit+'</td>'+
      '<td class="nowrap">'+r.pub+'</td><td class="nowrap">'+r.ut+'</td><td class="nowrap">'+r.exp+'</td>'+
      '<td>'+ord+'</td></tr>';
  }).join('') : '<tr><td colspan="13" style="text-align:center;color:#9aa3af;padding:36px 0">该状态下暂无需求</td></tr>';
  document.getElementById('reqCount').textContent='共 '+list.length+' 条';
}
function nowStamp(){
  var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
  return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' '+(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
}
function selectedReqs(){
  return Array.prototype.slice.call(document.querySelectorAll('#reqBody .reqchk:checked'))
    .map(function(c){return c.dataset.no;});
}
document.getElementById('reqAll').addEventListener('change',function(){
  var on=this.checked;
  document.querySelectorAll('#reqBody .reqchk').forEach(function(c){c.checked=on;});
});
document.getElementById('btnPass').addEventListener('click',function(){
  var sel=selectedReqs();
  if(!sel.length){alert('请先勾选需要通过的需求。');return;}
  var hit=REQUESTS.filter(function(r){return sel.indexOf(r.no)>=0&&r.st==='审核中';});
  if(!hit.length){alert('勾选的需求中没有「审核中」的,无需通过。');return;}
  if(!confirm('确认通过 '+hit.length+' 条需求?\n通过后立即进入接单大厅,卖家可见并可接单。'))return;
  hit.forEach(function(r){
    r.st='待接单';r.stc='st-run';r.by='租户人工审核通过';r.ut=nowStamp();
    var d=REQ_DETAIL[r.no]; if(d)d.audit='机审转人工 · 已人工审核通过';
  });
  document.getElementById('reqAll').checked=false;
  renderRequests();
});
document.getElementById('btnCancel').addEventListener('click',function(){
  var sel=selectedReqs();
  if(!sel.length){alert('请先勾选需要取消的需求。');return;}
  var hit=REQUESTS.filter(function(r){return sel.indexOf(r.no)>=0&&(r.st==='审核中'||r.st==='待接单');});
  if(!hit.length){alert('勾选的需求中没有可取消的。');return;}
  if(!confirm('确认取消 '+hit.length+' 条需求?\n取消后立即从接单大厅下架,并<b>原路退款</b>给买家。'.replace(/<[^>]+>/g,'')))return;
  hit.forEach(function(r){
    r.st='已取消';r.stc='st-close';r.by='租户手动取消';r.pay='已退款';r.ut=nowStamp();
    var d=REQ_DETAIL[r.no]; if(d)d.audit='机审通过 · 上线后由运营人工取消';
  });
  document.getElementById('reqAll').checked=false;
  renderRequests();
});
document.getElementById('reqTabs').addEventListener('click',function(e){
  var t=e.target.closest('.tab'); if(!t)return;
  document.querySelectorAll('#reqTabs .tab').forEach(function(x){x.classList.remove('on');});
  t.classList.add('on'); reqTab=t.dataset.st;
  document.getElementById('reqAll').checked=false;
  renderRequests();
});

/* ---------------- 需求详情 modal ---------------- */
function openReq(no){
  var d=REQ_DETAIL[no]; if(!d)return;
  var comboHtml = d.combo
    ? '<div class="combo">'+d.combo.map(function(c){return '<div class="cr"><span>'+c[0]+'</span></div>';}).join('')+'</div>'
    : '';
  var kv=function(k,v){return '<span class="k">'+k+'</span><span class="v">'+v+'</span>';};

  document.getElementById('mBody').innerHTML=
    '<div class="sec"><div class="sh">需求信息</div><div class="kv">'+
      kv('需求编号',no)+
      kv('发起方式',d.mode)+
      kv('买家',d.buyer)+
      kv('品牌 / 品类','Diablo 4 · GamePal &amp; Boosting / Custom')+
      kv('赛季 / 模式',d.realm||'赛季 · 软核')+
      kv('平台',d.plat||'PC')+
      kv('递送方式',d.deliv||'组队陪同')+
      kv('代练限时',d.limit)+
      kv('已付金额',d.price+'　<span class="badge bg-cus">发布时已支付</span>')+
      kv('支付方式',d.payMethod||'Visa ****4821')+
      kv('第三方支付单号','<span class="code">'+(d.payNo||'PI-2608260703270286')+'</span>')+
      kv('支付时间',d.payTime||d.pub)+
      kv('支付风控',d.payRisk||'已通过 · 未命中规则')+
      kv('资金状态',d.payState||'已托管')+
      kv('发布时间',d.pub)+
      kv('报价有效期',d.expire)+
      kv('关联订单',d.order?('<span class="lnk">'+d.order+'</span>'):'<span class="muted">尚未生成</span>')+
    '</div>'+
    (d.combo?('<div style="margin-top:12px"><div class="muted" style="margin-bottom:6px">组合内容(转为商品属性)</div>'+comboHtml+'</div>'):'')+
    '</div>'+

    '<div class="sec"><div class="sh">需求要求</div><div class="free">'+d.req+'</div></div>'+
    '<div class="sec"><div class="sh">备注</div><div class="free">'+(d.note&&d.note!=='—'?d.note:'<span class="muted">无</span>')+'</div></div>';

  document.getElementById('mask').classList.add('show');
}

/* ---------------- wiring ---------------- */
document.querySelectorAll('.grp>.gh').forEach(function(h){
  h.addEventListener('click',function(){h.parentElement.classList.toggle('open');});
});
var curPage='prod', curView='proto';
function paint(){
  ['prod','req','order'].forEach(function(k){
    document.getElementById('page-'+k).style.display=(curView==='proto'&&curPage===k)?'':'none';
  });
  document.getElementById('page-doc').style.display=(curView==='doc')?'':'none';
  document.querySelectorAll('.vtab').forEach(function(v){v.classList.toggle('on',v.dataset.view===curView);});
  document.getElementById('annoSwWrap').style.visibility=(curView==='proto')?'':'hidden';
  document.getElementById('annoDesc').innerHTML=(curView==='proto')
    ? '成交瞬间由系统生成一个隐藏商品承载订单参数;订单侧与普通订单完全一致。橙色标记处为本方案<b>新增/改动</b>的部分。'
    : '需求与订单的流转全流程。此说明页是原型脚手架,<b>不是产品页面</b>。';
  window.scrollTo(0,0);
}
document.querySelectorAll('.sub a').forEach(function(a){
  a.addEventListener('click',function(){
    if(!a.dataset.page)return;
    document.querySelectorAll('.sub a').forEach(function(x){x.classList.remove('on');});
    a.classList.add('on');
    curPage=a.dataset.page; curView='proto'; paint();
  });
});
document.querySelectorAll('.vtab').forEach(function(v){
  v.addEventListener('click',function(){curView=v.dataset.view;paint();});
});
document.getElementById('osrcSel').addEventListener('change',renderOrders);
document.getElementById('btnQuery').addEventListener('click',renderProducts);
document.getElementById('btnQuery2').addEventListener('click',renderOrders);
document.body.addEventListener('click',function(e){
  var r=e.target.closest('[data-req]'); if(r){openReq(r.dataset.req);}
});
document.getElementById('mClose').addEventListener('click',function(){document.getElementById('mask').classList.remove('show');});
document.getElementById('mask').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
document.getElementById('annoSw').addEventListener('change',function(){
  document.body.classList.toggle('showanno',this.checked);
});

renderProducts();renderOrders();renderRequests();paint();
<\/script>
</body>
</html>
</script>

<script>
var loaded={};
function load(v){
  if(loaded[v])return;
  var f=document.getElementById(v==='new'?'fnew':'fold');
  f.srcdoc=document.getElementById('src-'+v).textContent.replace(/<\\\/script/g,'</scr'+'ipt');
  loaded[v]=true;
}
document.querySelectorAll('.pill').forEach(function(p){
  p.addEventListener('click',function(){
    var v=p.dataset.v;
    document.querySelectorAll('.pill').forEach(function(x){x.classList.toggle('on',x===p);});
    load(v);
    document.getElementById('fnew').classList.toggle('on',v==='new');
    document.getElementById('fold').classList.toggle('on',v==='old');
  });
});
load('new');
</script>
</body>
